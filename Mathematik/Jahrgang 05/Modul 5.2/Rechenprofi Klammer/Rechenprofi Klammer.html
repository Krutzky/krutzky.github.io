<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rechenprofi Klammer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Same look as "Rechenprofi Plus und Minus": squared exercise paper, Fredoka headings, Andika (LRS-friendly) body. */
:root{
  --paper:#F7FAFD; --line:#D3E0EE; --surface:#FFFFFF; --ink:#1C2A4A; --muted:#4D5A77;
  --red:#C8102E; --ok:#14774A; --okbg:#E3F5EB; --badbg:#FCE6E9; --focus:#2457B8;
  --orange:#B85400; --pink:#B0005C; --purple:#6C3A98; --soft:#EEF3F9; --sun:#FFF4CC;
  --f-head:"Fredoka","Andika","Trebuchet MS",sans-serif;
  --f-body:"Andika","Segoe UI",system-ui,sans-serif;
  font-size:17px;
}
:root.big{font-size:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:880px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left)) 48px max(16px,env(safe-area-inset-right))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between}
h1{font-family:var(--f-head);font-weight:600;font-size:1.65rem;margin:0}
h1 .br{color:var(--red)}
h2{font-family:var(--f-head);font-weight:600;font-size:1.3rem;margin:0 0 8px}
h3{font-family:var(--f-head);font-weight:500;font-size:1.1rem;margin:0 0 6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.inp:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stars{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.stars svg{width:20px;height:20px;fill:#E0A800}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
nav.tabs{display:flex;gap:6px;margin:14px 0 12px;overflow-x:auto}
nav.tabs button{border:none;background:transparent;padding:8px 14px;border-radius:10px;font-family:var(--f-head);font-weight:500;font-size:1.02rem;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 0 var(--line)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lvl{border:3px solid var(--c);background:var(--surface);border-radius:12px;padding:8px 6px;text-align:center;font-family:var(--f-head);font-weight:500;line-height:1.2}
.lvl small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.lvl[aria-pressed="true"]{background:var(--c);color:#fff}
.lvl[aria-pressed="true"] small{color:#fff}
.lvl1{--c:var(--orange)} .lvl2{--c:var(--pink)} .lvl3{--c:var(--purple)}
.taskhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;color:#fff;background:var(--c,var(--ink))}
.instr{display:flex;gap:8px;align-items:flex-start;margin:4px 0 12px}
.say{flex:none;border:1px solid var(--line);background:var(--soft);border-radius:10px;width:2.4rem;height:2.4rem;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem}
.story{background:var(--soft);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:1.08rem;display:flex;gap:8px;align-items:flex-start}
.story p{margin:0}
.bigterm{font-size:2.1rem;font-weight:700;text-align:center;margin:8px 0 14px;font-variant-numeric:tabular-nums;letter-spacing:.5px;line-height:1.3}
.br{color:var(--red);font-weight:700}
.hl{background:#FFE08A;border-radius:6px;padding:0 4px}
.lines{display:grid;gap:10px;margin:6px 0}
.lineitem{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:1.35rem;font-variant-numeric:tabular-nums}
.lineitem .lab{font-size:.95rem;color:var(--muted);font-weight:700;min-width:7.5em}
.lineitem.done{background:var(--okbg)}
.inp{display:inline-flex;align-items:center;justify-content:center;min-width:4.2em;height:2.2em;padding:0 10px;border:2px dashed var(--muted);border-radius:10px;background:var(--surface);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.inp.gap{min-width:3.2em}
.inp.active{border:3px solid var(--focus)}
.inp.ok{border:2px solid var(--ok);background:var(--okbg);color:var(--ok)}
.inp.bad{border:2px solid var(--red);background:var(--badbg);color:var(--red)}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px auto 0;max-width:520px}
.keypad button{border:1px solid var(--line);background:var(--soft);border-radius:12px;min-height:3.1rem;font-size:1.4rem;font-weight:700}
.keypad button.wide{grid-column:span 2;font-size:1rem}
.keypad button.go{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.btn{border-radius:12px;padding:11px 18px;font-family:var(--f-head);font-weight:500;font-size:1.05rem;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.tip{background:var(--sun);color:#4A3800;border-color:#E2C65A}
.choices{display:grid;gap:8px;margin:8px 0}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.bad{border-color:var(--red);background:var(--badbg)}
.choice.txt{font-size:1.05rem;font-weight:400}
.brterm{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;font-size:2rem;font-weight:700;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.brterm .br{font-size:2.3rem}
.numchip{border:3px solid var(--line);background:var(--surface);border-radius:12px;padding:4px 12px;font:inherit;font-weight:700;min-width:2.6em}
.numchip.in{background:#FFE08A;border-color:#C99A00}
.numchip.start{border-color:var(--focus)}
.numchip:disabled{cursor:default}
.brhint{text-align:center;color:var(--muted);margin:4px 0 0}
.msg{margin-top:12px;border-radius:12px;padding:10px 14px;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.bad{background:var(--badbg);color:var(--red)}
.msg.info{background:var(--soft);color:var(--ink);font-weight:400}
.tipcard{margin-top:12px;border:2px solid #E2C65A;background:#FFFBEA;color:#3D3000;border-radius:14px;padding:12px 14px;display:flex;gap:8px;align-items:flex-start}
.tipcard b{font-family:var(--f-head);font-weight:600}
.answer{margin-top:12px;font-size:1.1rem;font-weight:700;background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 14px}
.progress{color:var(--muted);font-size:.9rem;text-align:center;margin-top:10px}
.tom{background:var(--badbg);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:1.25rem;font-variant-numeric:tabular-nums}
.tom p{margin:2px 0}
.partner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.partner .who{flex:1 1 260px}
.names{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.names label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:2px;flex:1 1 140px}
.names input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.swap{margin-top:12px;border:2px solid var(--focus);background:#E9F0FB;border-radius:14px;padding:12px 14px}
.swap p{margin:4px 0}
.xmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:12px}
.xmode{border:2px solid var(--purple);background:var(--surface);border-radius:12px;padding:10px;font-family:var(--f-head);font-weight:500;text-align:left}
.xmode[aria-pressed="true"]{background:var(--purple);color:#fff}
.player .term{font-size:2rem;font-weight:700;text-align:center;min-height:3.2rem;font-variant-numeric:tabular-nums}
.steptext{background:var(--soft);border-radius:12px;padding:12px 14px;min-height:4.5em;display:flex;gap:8px;align-items:flex-start}
.stepnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:10px}
.section{margin-bottom:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.box{background:var(--soft);border-radius:12px;padding:12px 14px;font-variant-numeric:tabular-nums}
.box .t{font-size:1.4rem;font-weight:700}
.rule{background:var(--sun);border:2px solid #E2C65A;border-radius:14px;padding:12px 16px}
.rule ol{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:1.1rem}
.err{display:grid;gap:10px}
.erritem{background:var(--badbg);border-radius:12px;padding:10px 12px}
.erritem s{color:var(--red)}
.gloss{width:100%;border-collapse:collapse}
.gloss td,.gloss th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{perspective:900px;min-height:200px;border:none;background:none;padding:0;text-align:left}
.fin{position:relative;width:100%;height:100%;min-height:200px;transition:transform .45s;transform-style:preserve-3d}
.fcard[aria-pressed="true"] .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;padding:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.front{background:var(--surface)}
.front .q{font-family:var(--f-head);font-weight:600;font-size:1.15rem}
.front .hint{margin-top:auto;font-size:.82rem;color:var(--muted)}
.back{background:#FFFBEA;color:#3D3000;transform:rotateY(180deg);border-color:#E2C65A;overflow:auto}
.num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex:none}
@media (prefers-reduced-motion: reduce){.fin{transition:none}}
@media (max-width:520px){.keypad{grid-template-columns:repeat(5,1fr)} .keypad button.wide{grid-column:span 5} .lineitem .lab{min-width:0;width:100%} .bigterm{font-size:1.6rem}}
.lvl.locked{opacity:.55;cursor:not-allowed}
.rulebox ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.intro{display:grid;gap:14px}
.why{margin-top:12px;border:2px solid var(--red);background:var(--badbg);border-radius:14px;padding:12px 14px}
.why b.h{font-family:var(--f-head);font-weight:600;display:block;margin-bottom:4px}
.keypad button.wide{grid-column:span 2}
.choice.sel{border-color:var(--focus);font-weight:700}
.choice:disabled{cursor:default;opacity:1}
.sentence{border-radius:12px}
.svdone{margin-top:16px;border-color:var(--ok);text-align:center}.svdone b{font-size:1.5rem;color:var(--ok)}.choice:disabled{opacity:1;cursor:default}.gate{border:3px solid #C8423D;background:#FDECEC;color:#3A0D0B;border-radius:16px;padding:18px;text-align:center}.gate .gsig{font-size:54px;line-height:1}.gate h3{color:#B42318;margin:6px 0 8px;font-size:1.3rem}.gate .gq{font-weight:700}.codebox{display:inline-flex;flex-direction:column;align-items:center;background:#111;color:#FFC94D;border-radius:12px;padding:6px 22px;margin-top:6px;font-family:ui-monospace,Menlo,monospace}.codebox small{font-size:.7rem;letter-spacing:2px;color:#9a9a9a}.codebox span{font-size:2rem;letter-spacing:4px}.codepad{max-width:420px}.codepad button{min-height:52px}.gaterow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}.rulebox .starts{color:var(--muted);margin-top:8px}.rulebox .btn{margin-top:10px}
.bonus{margin-top:18px;border:3px solid var(--orange);border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--orange) 7%,var(--surface))}
.bonus h3{margin:0 0 4px;font-family:var(--f-head)}
.bzrank{display:inline-block;background:var(--orange);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;margin:4px 0 8px}
.wall{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0 4px}
.wrow{display:flex;gap:6px}
.brick{width:68px;height:48px;border-radius:8px;border:2px solid #B9542A;background:#F6D9C6;font-size:1.35rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.brick.hid{background:var(--surface);border-style:dashed;border-color:var(--muted);cursor:pointer}
.brick.hid.active{border:3px solid var(--focus)}
.brick.bad{background:var(--badbg);border-color:var(--carry);border-style:solid;color:var(--carry)}
.brick.ok{background:var(--okbg);border-color:var(--ok);border-style:solid;color:var(--ok)}
.choice.sel{border-color:var(--focus);background:color-mix(in srgb,var(--focus) 12%,var(--surface));font-weight:700}
/* ===== Farben und Look wie im Kosten-Detektiv ===== */
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --soft:#F3F5FA; --ink:#0B1442; --muted:#4E5677; --line:#CBD3E1;

  --navy:#020C45; --accent:#E8892B; --accent-ink:#1B1300; --blue-soft:#DCE8F7; --pro:#6B3FB0;
  --f-head:"Lexend","Segoe UI",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
}

header.kd .route button{display:flex;align-items:center;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;font-family:var(--f-body)}
header.kd .route button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
header.kd .hright{display:flex;gap:8px;align-items:center}

<body>
<header class="kd">
  <div class="hwrap">
    <div class="brand"><b id="apptitle"></b><span id="appsub"></span></div>

function genPlace(){
  for(let k=0;k<300;k++){
    const nums=[R(20,90),R(2,30),R(2,30),R(2,20)], ops=[pick(["-","-","+"]),pick(["-","+"]),pick(["-","+"])];
    const base=[nums[0],ops[0],nums[1],ops[1],nums[2],ops[2],nums[3]];
    const cand=[[0,2],[2,4],[4,6],[2,6],[0,4]].map(([i,j])=>{const t=base.slice();t.splice(j+1,0,")");t.splice(i,0,"(");return t});
    const all=[base,...cand].filter(valid);
    const vals=all.map(val);
    const uniq=all.filter((t,i)=>vals.filter(v=>v===vals[i]).length===1 && t.includes("("));
    if(uniq.length && all.length>=4){const target=pick(uniq);const others=shuffle(all.filter(t=>t!==target)).slice(0,3);return {target:val(target),opts:shuffle([target,...others]),correct:target}}
  }

function genError(){

    const b=R(10,60),c=R(2,inner==="-"?b-2:40),a=R(inner==="+"?b+c+5:b,120);
    const t=[a,"-","(",b,inner,c,")"]; if(!valid(t))continue;

      lines=[`${a} − ${b} = ${s1}`,`${s1} ${inner==="+"?"+":"−"} ${c} = ${s2}`];}
    else if(type==="inner"){const w=g+pick([10,-10,1,-1]); if(w<0||a-w<0)continue; lines=[`${b} ${inner==="+"?"+":"−"} ${c} = ${w}`,`${a} − ${w} = ${a-w}`];}
    else if(type==="sign"){const w=inner==="+"?b-c:b+c; if(w<0||a-w<0||w===g)continue; lines=[`${b} ${inner==="+"?"+":"−"} ${c} = ${w}`,`${a} − ${w} = ${a-w}`];}

   q: d => ({ ctx: tt(`Lea hat ${d.a} €. Sie kauft ein Buch für ${d.b} € und ein Spiel für ${d.c} €. Wie viel Geld hat sie danach noch?`, `Lea'nın ${d.a} € parası var. ${d.b} € değerinde bir kitap ve ${d.c} € değerinde bir oyun alıyor. Sonra ne kadar parası kalıyor?`), stem: tt("Welcher Term passt?", "Hangi ifade uygun?"), opts: [`${d.a} ${MINUS} (${d.b} + ${d.c})`, `${d.a} ${MINUS} ${d.b} + ${d.c}`, `${d.a} + (${d.b} + ${d.c})`], hint: tt("Buch und Spiel werden beide bezahlt. Beide Preise werden abgezogen.", "Kitap ve oyunun ikisi de ödeniyor. İki fiyat da çıkarılır.") }) },
 { fix: { a: 75, b: 20, c: 5 }, rnd: () => ({ a: 5 * rnd(12, 19), b: 5 * rnd(3, 6), c: 5 * rnd(1, 2) }),
   q: d => ({ stem: tt(`Wo muss die Klammer stehen, damit ${d.a} ${MINUS} ${d.b} + ${d.c} = ${d.a - d.b - d.c} ist?`, `${d.a} ${MINUS} ${d.b} + ${d.c} = ${d.a - d.b - d.c} olması için parantez nereye gelmeli?`), opts: [`${d.a} ${MINUS} (${d.b} + ${d.c})`, `(${d.a} ${MINUS} ${d.b}) + ${d.c}`, tt(`${d.a} ${MINUS} ${d.b} + ${d.c} (ohne Klammer)`, `${d.a} ${MINUS} ${d.b} + ${d.c} (parantezsiz)`)], hint: tt(`${d.a - d.b - d.c} ist kleiner als ${d.a} ${MINUS} ${d.b}. Also muss ${d.c} auch abgezogen werden.`, `${d.a - d.b - d.c}, ${d.a} ${MINUS} ${d.b} sonucundan küçük. Yani ${d.c} de çıkarılmalı.`) }) }
];
/* ---- Bonus nach der Sicherung: Zahlenmauern (endlos, drei Stufen) ---- */
let bz = null;
function bzSolvable(n, hid) {
  const k = []; for (let r = 0; r < n; r++) { k.push([]); for (let i = 0; i < n - r; i++) k[r].push(!hid.has(r + "," + i)) }
  let ch = true;
  while (ch) { ch = false;
    for (let r = 1; r < n; r++) for (let i = 0; i < n - r; i++) {
      const a = k[r - 1][i], b = k[r - 1][i + 1], c = k[r][i];
      if (!c && a && b) { k[r][i] = true; ch = true }
      if (c && a && !b) { k[r - 1][i + 1] = true; ch = true }
      if (c && !a && b) { k[r - 1][i] = true; ch = true }
    } }
  return k.every(row => row.every(Boolean));
}
function bzNew() {
  const done = bz ? bz.done : 0, lvl = Math.min(3, 1 + Math.floor(done / 2));
  const n = lvl === 1 ? 3 : 4, lo = [1, 2, 5][lvl - 1], hi = [20, 25, 30][lvl - 1], nh = [3, 5, 6][lvl - 1];
  const v = [[]]; for (let i = 0; i < n; i++) v[0].push(rnd(lo, hi));
  for (let r = 1; r < n; r++) { v.push([]); for (let i = 0; i < n - r; i++) v[r].push(v[r - 1][i] + v[r - 1][i + 1]) }
  const all = []; for (let r = 0; r < n; r++) for (let i = 0; i < n - r; i++) all.push(r + "," + i);
  let hid = null;
  for (let t = 0; t < 500; t++) {
    const s = new Set(all.slice().sort(() => Math.random() - .5).slice(0, nh));
    const base = [...s].filter(x => x.startsWith("0,")).length;
    if (lvl === 3 && base < 2) continue;
    if (lvl === 1 && base > 1) continue;
    if (bzSolvable(n, s)) { hid = s; break }
  }
  if (!hid) hid = new Set(all.filter(x => !x.startsWith("0,")));
  const up = bz && lvl > bz.lvl;
  bz = { done, lvl, n, v, hid, inp: {}, sel: [...hid][0], marks: {}, msg: up ? ["info", L().bzUp] : null, solved: false };
}
function renderBonus(p) {
  if (!bz) bzNew();
  const b = el("div", "bonus");
  b.appendChild(el("h3", "", L().bzT));
  b.appendChild(el("p", "", L().bzIntro));
  b.appendChild(el("span", "bzrank", `${L().bzRank[bz.lvl - 1]} · ${L().bzCount(bz.done)}`));
  const w = el("div", "wall");
  for (let r = bz.n - 1; r >= 0; r--) {
    const row = el("div", "wrow");
    for (let i = 0; i < bz.n - r; i++) {
      const key = r + "," + i, h = bz.hid.has(key);
      const c = el(h ? "button" : "div", "brick" + (h ? " hid" : "") + (h && bz.sel === key && !bz.solved ? " active" : "") + (bz.marks[key] ? " " + bz.marks[key] : ""), h ? (bz.inp[key] || "") : String(bz.v[r][i]));
      if (h) { c.type = "button"; c.setAttribute("aria-label", "Stein " + (r + 1) + "." + (i + 1)); c.onclick = () => { if (!bz.solved) { bz.sel = key; render() } } }
      row.appendChild(c);
    }
    w.appendChild(row);
  }
  b.appendChild(w);
  if (!bz.solved) {
    const kp = el("div", "keypad");
    ["1","2","3","4","5","6","7","8","9","0"].forEach(x => { const k = el("button", "", x); k.type = "button"; k.onclick = () => { const s = bz.inp[bz.sel] || ""; if (s.length < 3) bz.inp[bz.sel] = s + x; delete bz.marks[bz.sel]; bz.msg = null; render() }; kp.appendChild(k) });
    const del = el("button", "wide", "⌫"); del.type = "button"; del.setAttribute("aria-label", L().gateDel); del.onclick = () => { bz.inp[bz.sel] = (bz.inp[bz.sel] || "").slice(0, -1); delete bz.marks[bz.sel]; render() }; kp.appendChild(del);
    b.appendChild(kp);
  }
  const act = el("div", "actions");
  if (!bz.solved) {
    const ck = el("button", "btn primary", L().bzCheck); ck.type = "button";
    ck.onclick = () => {
      const keys = [...bz.hid];
      if (keys.some(k => !bz.inp[k])) { bz.msg = ["bad", L().bzEmpty]; render(); return }
      bz.marks = {}; let ok = true;
      keys.forEach(k => { const [r, i] = k.split(",").map(Number); const g = Number(bz.inp[k]) === bz.v[r][i]; bz.marks[k] = g ? "ok" : "bad"; if (!g) ok = false });
      if (ok) { bz.solved = true; bz.done++; stats.stars++; save(); bz.msg = ["ok", L().bzOk] } else bz.msg = ["bad", L().bzBad];
      render();
    };
    act.appendChild(ck);
  } else { const nx = el("button", "btn good", L().bzNext); nx.type = "button"; nx.onclick = () => { bzNew(); render() }; act.appendChild(nx) }
  b.appendChild(act);
  if (bz.msg) b.appendChild(el("div", "msg " + bz.msg[0], bz.msg[1]));
  p.appendChild(b);
}

renderChrome(); render();
