<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Überschlagsprofi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>

html,body{margin:0}


/* Layout: a single working column over squared exercise-book paper; the grid of Rechenkästchen is the hero. */
:root{
  --paper:#F7FAFD; --line:#D3E0EE; --surface:#FFFFFF; --ink:#1C2A4A; --muted:#55627F;
  --carry:#D3263A; --ok:#17844F; --okbg:#E3F5EB; --badbg:#FCE6E9; --focus:#2B6CD8;
  --orange:#E97A00; --pink:#CF0A6E; --purple:#6C3A98; --soft:#EEF3F9;
  --f-head:"Fredoka","Andika","Trebuchet MS",sans-serif;
  --f-body:"Andika","Segoe UI",system-ui,sans-serif;
  --cell:clamp(38px,9.4vw,54px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111827; --line:#223149; --surface:#18233A; --ink:#E5ECF8; --muted:#A3B0C8;
  --carry:#FF6F80; --ok:#4FCB8C; --okbg:#173A2B; --badbg:#47202A; --focus:#7FB0FF;
  --orange:#FF9C33; --pink:#FF5AAE; --purple:#B78AEA; --soft:#1F2B44; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827; --line:#223149; --surface:#18233A; --ink:#E5ECF8; --muted:#A3B0C8;
  --carry:#FF6F80; --ok:#4FCB8C; --okbg:#173A2B; --badbg:#47202A; --focus:#7FB0FF;
  --orange:#FF9C33; --pink:#FF5AAE; --purple:#B78AEA; --soft:#1F2B44; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:860px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
h1{font-family:var(--f-head);font-weight:600;font-size:1.6rem;margin:0;letter-spacing:.2px;text-wrap:balance}
h1 .pm{color:var(--carry)}
h2{font-family:var(--f-head);font-weight:600;font-size:1.3rem;margin:0 0 8px}
h3{font-family:var(--f-head);font-weight:500;font-size:1.1rem;margin:0 0 6px}
.hright{display:flex;gap:8px;align-items:center}
.stars{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.stars svg{width:20px;height:20px;fill:#F2B705}
button{font:inherit;color:inherit;cursor:pointer}
.langbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700}
nav.tabs{display:flex;gap:6px;margin:14px 0 12px;overflow-x:auto}
nav.tabs button{border:none;background:transparent;padding:8px 14px;border-radius:10px;font-family:var(--f-head);font-weight:500;font-size:1.02rem;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 0 var(--line)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lvl.locked{opacity:.55;cursor:not-allowed}
.lvl{border:2px solid var(--c);background:var(--surface);border-radius:12px;padding:8px 6px;text-align:center;font-family:var(--f-head);font-weight:500;line-height:1.2}
.lvl small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lvl[aria-pressed="true"]{background:var(--c);color:#fff}
.lvl[aria-pressed="true"] small{color:#fff}
.lvl1{--c:var(--orange)} .lvl2{--c:var(--pink)} .lvl3{--c:var(--purple)}
.taskhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;color:#fff;background:var(--c)}
.instr{margin:4px 0 12px}
.word{background:var(--soft);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:1.05rem}
.gridbox{overflow-x:auto;padding:6px 0 4px}
.cgrid{display:grid;gap:0;width:max-content;margin:0 auto;font-variant-numeric:tabular-nums;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.6);font-weight:700;position:relative}
.cell.lab{font-size:calc(var(--cell)*.32);color:var(--muted);font-weight:700}
.cell.sign{color:var(--ink)}
.cell.in{cursor:pointer;background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:6px;margin:3px;width:calc(var(--cell) - 6px);height:calc(var(--cell) - 6px);border:2px dashed var(--muted)}
.cell.in.active{border:3px solid var(--focus);background:var(--surface)}
.cell.carry{font-size:calc(var(--cell)*.42);color:var(--carry)}
.cell.carry.in{border-color:var(--carry);border-width:1.5px;width:calc(var(--cell) - 18px);height:calc(var(--cell) - 18px);margin:9px}
.cell.carry.in.active{border-width:3px}
.cell.ok{background:var(--okbg);border-color:var(--ok);border-style:solid;color:var(--ok)}
.cell.bad{background:var(--badbg);border-color:var(--carry);border-style:solid;color:var(--carry)}
.cell.sol{color:var(--focus)}
.cell.hl{background:color-mix(in srgb,var(--focus) 16%,transparent);border-radius:4px}
.rule{grid-column:1/-1;height:3px;background:var(--ink);border-radius:2px;margin:0 2px}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px auto 0;max-width:520px}
.keypad button{border:1px solid var(--line);background:var(--soft);border-radius:12px;min-height:52px;font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.keypad button.wide{grid-column:span 2;font-size:1rem}
.keypad button:active{transform:translateY(1px)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.btn{border:none;border-radius:12px;padding:12px 18px;font-family:var(--f-head);font-weight:500;font-size:1.05rem;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.tip{background:#FFF4CC;color:#5A4500;border-color:#E8CF6A}
:root[data-theme="dark"] .btn.tip{background:#3A3115;color:#FFE18A;border-color:#6B5A1E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.tip{background:#3A3115;color:#FFE18A;border-color:#6B5A1E}}
.choices{display:grid;gap:8px;margin:8px 0}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1.1rem;font-variant-numeric:tabular-nums}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.bad{border-color:var(--carry);background:var(--badbg)}
.msg{margin-top:12px;border-radius:12px;padding:10px 14px;font-weight:700}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.bad{background:var(--badbg);color:var(--carry)}
.msg.info{background:var(--soft);color:var(--ink);font-weight:400}
.tipcard{margin-top:12px;border:2px solid #E8CF6A;background:#FFFBEA;color:#3D3000;border-radius:14px;padding:12px 14px}
:root[data-theme="dark"] .tipcard{background:#2B2510;color:#FFEAA8;border-color:#6B5A1E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tipcard{background:#2B2510;color:#FFEAA8;border-color:#6B5A1E}}
.tipcard b{font-family:var(--f-head);font-weight:600}
.claimed{display:inline-block;margin:0 0 10px;padding:6px 12px;border-radius:10px;background:var(--soft);font-variant-numeric:tabular-nums}
.progress{color:var(--muted);font-size:.9rem;text-align:center;margin-top:10px;font-variant-numeric:tabular-nums}
/* explanation */
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.term{background:var(--soft);border-radius:12px;padding:12px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.term .eq{font-size:1.4rem;font-weight:700;margin:4px 0}
.term .lbl{font-size:.85rem;color:var(--muted)}
.player{display:grid;gap:12px}
.steptext{background:var(--soft);border-radius:12px;padding:12px 14px;min-height:4.5em}
.stepnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.stepnav .count{color:var(--muted);font-variant-numeric:tabular-nums;min-width:4em;text-align:center}
.section{margin-bottom:16px}
/* merkzettel */
.merk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.merk ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.err{display:grid;gap:10px}
.erritem{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;background:var(--badbg);border-radius:12px;padding:10px 12px}
.erritem .ex{font-variant-numeric:tabular-nums;font-weight:700}
.erritem .ex s{color:var(--carry)}
.gloss{width:100%;border-collapse:collapse;font-size:.95rem}
.gloss td,.gloss th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
/* tip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{perspective:900px;min-height:190px;border:none;background:none;padding:0;text-align:left}
.fin{position:relative;width:100%;height:100%;min-height:190px;transition:transform .45s;transform-style:preserve-3d}
.fcard[aria-pressed="true"] .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;padding:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.front{background:var(--surface)}
.front .q{font-family:var(--f-head);font-weight:600;font-size:1.15rem}
.front .hint{margin-top:auto;font-size:.82rem;color:var(--muted)}
.back{background:#FFFBEA;color:#3D3000;transform:rotateY(180deg);border-color:#E8CF6A;font-size:.98rem;overflow:auto}
:root[data-theme="dark"] .back{background:#2B2510;color:#FFEAA8;border-color:#6B5A1E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .back{background:#2B2510;color:#FFEAA8;border-color:#6B5A1E}}
.num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex:none}
/* partner work */
.partner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.partner .who{flex:1 1 260px;min-width:0}
.partner .pbtns{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.names{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.names label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:2px;flex:1 1 140px}
.names input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.swap{margin-top:12px;border:2px solid var(--focus);background:color-mix(in srgb,var(--focus) 10%,var(--surface));border-radius:14px;padding:12px 14px}
.swap p{margin:4px 0}
/* diagnosis */
.why{margin-top:12px;border:2px solid var(--carry);background:var(--badbg);border-radius:14px;padding:12px 14px}
.why b.h{font-family:var(--f-head);font-weight:600;display:block;margin-bottom:4px}
.why .cardref{margin-top:8px;background:var(--surface);border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.linkbtn{border:none;background:none;color:var(--focus);font-weight:700;padding:4px 0;text-decoration:underline}
.colhelp{text-align:center;color:var(--focus);margin:0 0 4px}
/* experts */
.xhead{margin-bottom:12px}
.xhead p{margin:4px 0 0;color:var(--muted)}
.numchip{display:inline-block;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:0 6px;margin:0 1px;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.5}
.numchip[aria-pressed="true"]{border-color:var(--focus);background:color-mix(in srgb,var(--focus) 18%,var(--surface))}
.numchip.wrong{border-color:var(--carry);background:var(--badbg)}
.colbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.colbtns button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700}
.colbtns button.bad{border-color:var(--carry);background:var(--badbg)}
.colbtns button.ok{border-color:var(--ok);background:var(--okbg)}
.cell.errcol{outline:3px solid var(--carry);outline-offset:-3px;border-radius:4px}
@media (prefers-reduced-motion: reduce){.fin{transition:none}}
@media (max-width:520px){.erritem{grid-template-columns:1fr} .keypad{grid-template-columns:repeat(5,1fr)} .keypad button.wide{grid-column:span 5} .levels{gap:6px} .lvl{font-size:.92rem}}

/* Klammerprofi additions */
h1 .br{color:var(--focus)}
.term{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0 4px;line-height:1.3}
.term .bk{color:var(--focus)}
.term .hot{background:color-mix(in srgb,var(--focus) 16%,transparent);border-radius:8px;padding:0 4px}
.steps{display:grid;gap:6px;justify-content:center;margin:6px 0 4px}
.sline{display:flex;align-items:center;gap:8px;font-size:clamp(1.3rem,5vw,1.9rem);font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.sline .eq{color:var(--muted);min-width:1em}
.sline .bk{color:var(--focus)}
.sline .done{color:var(--ok)}
.ans{display:inline-flex;align-items:center;justify-content:center;min-width:3.2em;height:1.6em;padding:0 8px;border:2px dashed var(--muted);border-radius:8px;background:var(--surface);color:var(--ink)}
.ans.active{border:3px solid var(--focus)}
.ans.bad{border-style:solid;border-color:var(--carry);background:var(--badbg);color:var(--carry)}
.ans.sol{color:var(--focus);border-style:solid}
.stepnote{text-align:center;color:var(--muted);font-size:.95rem;margin:0}
.tomlines{display:grid;gap:6px;justify-content:center;margin:8px 0}
.tomline{display:flex;gap:10px;align-items:center;font-size:clamp(1.2rem,4.6vw,1.7rem);font-weight:700;font-variant-numeric:tabular-nums}
.tomline .lab{font-size:.8rem;font-weight:700;color:var(--muted);min-width:4.5em}
.tomline.mark{outline:3px solid var(--carry);outline-offset:4px;border-radius:6px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:8px 0}
.pair .term{background:var(--soft);border-radius:12px;padding:10px;margin:0;font-size:clamp(1.3rem,5vw,1.9rem)}
/* input intro */
.introbox h3{margin:0 0 6px;font-family:var(--f-head);font-weight:600;font-size:1.2rem}
.intro{display:grid;gap:14px}
.dice{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.die{width:64px;height:64px;border-radius:14px;background:var(--surface);border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.die b{font-size:1.5rem;line-height:1}
.die small{font-size:.7rem;color:var(--muted)}
.introbox{background:var(--soft);border-radius:14px;padding:14px 16px}
.introbox p{margin:6px 0}
.rulebox{border:3px solid var(--focus);border-radius:14px;padding:12px 16px;background:var(--surface)}
.rulebox b{font-family:var(--f-head);font-weight:600}
.dots{display:flex;gap:6px;justify-content:center}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--ink)}
.way{display:grid;gap:4px;justify-content:center;font-size:clamp(1.15rem,4.4vw,1.6rem);font-weight:700;font-variant-numeric:tabular-nums}
.way .eq{color:var(--muted)}



/* Überschlagsprofi additions */
h1 .br{color:var(--focus)}
.shop{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.shop td{padding:4px 2px;border-bottom:1px dashed var(--line)}
.shop td.r{text-align:right;font-weight:700;white-space:nowrap}
.shop tr.bud td{border-bottom:none;border-top:2px solid var(--ink);font-weight:700;padding-top:8px}
.shop .ic{width:2em;font-size:1.25rem}
.given{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.steps{display:grid;gap:8px;justify-content:center;margin:6px 0 4px}
.sline{display:flex;align-items:center;gap:8px;font-size:clamp(1.15rem,4.6vw,1.6rem);font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.sline .lab{font-size:.95rem;font-weight:400;color:var(--muted)}
.sline .done{color:var(--ok)}
.ans{display:inline-flex;align-items:center;justify-content:center;min-width:3.4em;height:1.6em;padding:0 8px;border:2px dashed var(--muted);border-radius:8px;background:var(--surface);color:var(--ink)}
.ans.active{border:3px solid var(--focus)}
.ans.bad{border-style:solid;border-color:var(--carry);background:var(--badbg);color:var(--carry)}
.ans.sol{color:var(--focus);border-style:solid}
.stepnote{text-align:center;color:var(--muted);font-size:.95rem;margin:0}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.prod{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;line-height:1.2}
.prod .ic{font-size:1.9rem}
.prod b{font-variant-numeric:tabular-nums}
.prod[aria-pressed="true"]{border-color:var(--ok);background:var(--okbg)}
.receipt{font-family:"Courier New",ui-monospace,monospace;background:#FFFDF6;color:#222;border:1px dashed #999;border-radius:6px;padding:12px 16px;max-width:360px;margin:0 auto 12px;font-variant-numeric:tabular-nums}
.receipt .r{display:flex;justify-content:space-between;gap:12px}
.receipt hr{border:0;border-top:1px dashed #999;margin:6px 0}
.receipt .tot{font-weight:700;font-size:1.15rem}
.tomlines{display:grid;gap:6px;justify-content:center;margin:8px 0}
.tomline{display:flex;gap:10px;align-items:center;font-size:clamp(1.1rem,4.4vw,1.5rem);font-weight:700;font-variant-numeric:tabular-nums}
.tomline .lab{font-size:.8rem;font-weight:700;color:var(--muted);min-width:4.5em}
.tomline.mark{outline:3px solid var(--carry);outline-offset:4px;border-radius:6px}
.introbox h3{margin:0 0 6px;font-family:var(--f-head);font-weight:600;font-size:1.2rem}
.intro{display:grid;gap:14px}
.introbox{background:var(--soft);border-radius:14px;padding:14px 16px}
.introbox p{margin:6px 0}
.rulebox{border:3px solid var(--focus);border-radius:14px;padding:12px 16px;background:var(--surface)}
.rulebox b{font-family:var(--f-head);font-weight:600}
.rulebox ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.dots{display:flex;gap:6px;justify-content:center}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--ink)}
.way{display:grid;gap:4px;justify-content:center;font-size:clamp(1.1rem,4.4vw,1.5rem);font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0}
.way .eq{color:var(--muted)}
.way .ok{color:var(--ok)}
.tags{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tag{background:#FFD34D;color:#3A2A00;border-radius:6px 14px 14px 6px;padding:4px 14px;font-weight:700;font-variant-numeric:tabular-nums}

function claim(b, E, U, s, lv) {

    row.append(go, st); u.appendChild(row); p.appendChild(u);
  }
  if (diag && !done) {
    const w = el("div", "why", `<b class="h">${L().whyTitle}</b>${diag.text}`);
    const cb = el("button", "linkbtn", L().cardBtn(diag.card + 1)); cb.type = "button"; cb.onclick = () => { showCard = !showCard; render() }; w.appendChild(cb);
    if (showCard) { const [q, a] = L().cards[diag.card]; w.appendChild(el("div", "cardref", `<b>${q}</b><br>${a}`)) }
    p.appendChild(w);
  }
  if (tipLevel > 0 && !done) p.appendChild(el("div", "tipcard", tipText()));
  if (done && partner.on) p.appendChild(el("div", "swap", `<p>${L().pSwap(pName(partner.turn), pName(1 - partner.turn))}</p><p><b>${L().pDiscuss}</b> ${L().pPm[task.mode] || L().pPm.def}</p>`));
}

/* ======================= interaction ======================= */
function onCellClick(e) { const c = e.target.closest(".cell.in"); if (!c || done) return; active = { role: c.dataset.role, p: Number(c.dataset.p) }; render() }
function typeDigit(d) {
  if (done) return; const P = ph();
  if (P.type === "grid") {
    if (!active) return; ent[active.role][active.p] = d; if (marks && active.role === "res") marks[active.p] = null;
    if (d !== "") { if (active.role === "res" && active.p < P.W - 1) active = { role: "res", p: active.p + 1 }; else if (active.role === "carry") active = { role: "res", p: active.p } }
    render(); return;
  }
  if (P.type !== "steps") return;
  if (d === "") entry = entry.slice(0, -1); else if (entry.length < 6) entry += d; badMark = false; revealed = false; render();
}
document.addEventListener("keydown", e => {
  if ((tab !== 1 && tab !== 2) || done || !task) return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  const P = ph(); if (!P || (P.type !== "steps" && P.type !== "grid")) return;
  if (/^[0-9]$/.test(e.key)) { typeDigit(e.key); e.preventDefault() }
  else if (e.key === "Backspace" || e.key === "Delete") { typeDigit(""); e.preventDefault() }
  else if (e.key === "Enter" && !(e.target && e.target.tagName === "BUTTON")) { check(); e.preventDefault() }
  else if (P.type === "grid" && e.key === "ArrowLeft" && active && active.role === "res" && active.p < P.W - 1) { active.p++; render() }
  else if (P.type === "grid" && e.key === "ArrowRight" && active && active.role === "res" && active.p > 0) { active.p--; render() }
});
function success(msg) { done = true; diag = null; stats.stars += attempts === 0 && tipLevel === 0 ? 2 : 1; stats.solved[curLevel() - 1]++; if (tab === 1) { if (attempts === 0 && !task.helped) stats.streak[level - 1]++; else stats.streak[level - 1] = 0 } act(true); save(); feedback = { cls: "ok", text: msg || pick(L().ok) }; render() }
function fail(text, d) { attempts++; act(false); badMark = true; feedback = { cls: "bad", text: text + (attempts >= 2 ? " " + L().bad2 : "") }; diag = d || null; showCard = false; render() }
function check() {
  if (done) return; const P = ph();
  if (P.type === "steps") {
    if (entry === "") { feedback = { cls: "bad", text: L().empty }; render(); return }
    const l = P.lines[lineIdx]; const v = Number(entry);
    if (v === l.value) {
      badMark = false; diag = null; revealed = false; entry = ""; tipLevel = Math.min(tipLevel, 1);
      if (lineIdx === P.lines.length - 1) { advance(P.lines.length > 1 ? L().stepOk.split("!")[0] + "!" : null); return }
      lineIdx++; feedback = { cls: "ok", text: L().stepOk }; render(); return;
    }
    fail(L().bad, diagLine(l, v)); return;
  }
  if (P.type === "grid") {
    if (ent.res.every(v => v === "")) { feedback = { cls: "bad", text: L().emptyGrid }; render(); return }
    marks = {}; let allOk = true;
    for (let p = 0; p < P.W; p++) { const exp = p < len(P.result) ? String(dig(P.result, p)) : null; const v = ent.res[p]; const ok = exp === null ? (v === "" || v === "0") : v === exp; if (exp !== null || v !== "") marks[p] = ok ? "ok" : "bad"; if (!ok) allOk = false }
    if (allOk) { advance(P.U ? L().gridOk(P.result, P.U) : null); return }
    attempts++; act(false); feedback = { cls: "bad", text: L().badGrid + (attempts >= 2 ? " " + L().bad2 : "") }; diag = diagGrid(P); showCard = false; render();
  }
}
function pickChoice(i) {
  const P = ph(), o = P.opts[i]; task.picked = i;
  if (o.ok) {
    if (o.replan) { task.phases = [{ type: "select" }]; pi = 0; initPhase(); feedback = { cls: "ok", text: L().planNo }; render(); return }
    advance(P.okMsg ? P.okMsg() : null); return;
  }
  if (Date.now() - phaseT0 < 2000) guessScore++;
  attempts++; act(false); task.badPicks.push(i); task.picked = null; feedback = { cls: "bad", text: o.bad ? o.bad() : L().bad }; render();
}
function checkNums() {
  const t = task; const extra = t.sel.filter(x => !t.need.includes(x)); const missing = t.need.filter(x => !t.sel.includes(x));
  if (extra.length) { attempts++; act(false); t.wrongSel = extra; feedback = { cls: "bad", text: L().numsExtra(extra[0]) }; render() }
  else if (missing.length) { attempts++; act(false); feedback = { cls: "bad", text: L().numsMissing }; render() }
  else advance(L().numsOk);
}
function pickLine(i) { if (i === task.first) advance(L().errLineOk(i + 1)); else { attempts++; act(false); if (!task.badLines.includes(i)) task.badLines.push(i); feedback = { cls: "bad", text: L().errLineBad }; render() } }
function pickReason(r) { if (r === task.errType) advance(); else { attempts++; act(false); if (!task.badReasons.includes(r)) task.badReasons.push(r); feedback = { cls: "bad", text: L().reasonBad }; render() } }
function showSolution() {
  task.helped = true; if (tab === 1) { stats.streak[level - 1] = 0; save() }
  const P = ph(); revealed = true;
  if (P.type === "steps") { lineIdx = P.lines.length - 1 }
  // solution ends the current work step; the task continues with the next phase
  const wasLast = pi === task.phases.length - 1;
  if (wasLast) { done = true; diag = null; feedback = { cls: "info", text: L().solShown }; stats.solved[curLevel() - 1]++; save(); render(); return }
  const msg = P.type === "grid" ? `${L().solShown} ${eur(P.result)}` : `${L().solShown} ${P.lines.map(l => fmt(l.value)).join(" · ")}`;
  pi++; initPhase(); feedback = { cls: "info", text: msg }; render();
}
/* ---- diagnosis ---- */
function diagLine(l, v) {
  if (l.kind === "round") {
    if (v === down(l.p, l.s)) return { text: L().dDown(l.s), card: 2 };
    if (v === l.p) return { text: L().dExactPrice, card: 1 };
    if (v % l.s !== 0) return { text: L().dNotRound(l.s), card: 0 };
    return { text: L().dRoundGen, card: 0 };
  }
  if (l.kind === "nround") {
    const n = l.n, pl = l.pl;
    if (v === down(n, pl) || v === up(n, pl)) return { text: L().dRoundDir, card: 0 };
    if ([10, 100, 1000].some(q => q !== pl && v === Math.floor(n / q + .5) * q)) return { text: L().dPlace(L().pl10[pl]), card: 8 };
    return { text: L().dRoundDir, card: 0 };
  }
  if (l.kind === "osum") return { text: v === l.exact ? L().dBookSum : L().dSumGen(`${fmt(l.ra)} ${l.op === "add" ? "+" : MINUS} ${fmt(l.rb)}`), card: 1 };
  if (l.kind === "sum") { if (v === l.E) return { text: L().dSumExact, card: 3 }; return { text: L().dSumGen(l.ups.map(fmt).join(" + ")), card: 3 } }
  if (l.kind === "rest") return { text: L().restBad(l.S, v, l.B), card: 6 };
  if (l.kind === "probe") return { text: L().dProbe, card: 6 };
  return null;
}
function diagGrid(P) {
  const entered = Number(ent.res.slice().reverse().join("").replace(/\D/g, "")) || 0;
  let pre = "";
  if (P.U) { if (entered > P.U) pre = L().dOverBig(P.U) + "<br>"; else if (entered <= P.U - P.n * P.s) pre = L().dOverSmall(P.U) + "<br>" }
  for (let p = 0; p < P.W; p++) {
    const v = ent.res[p];
    if (p >= len(P.result)) { if (v !== "" && v !== "0") return { text: pre + L().dLead, card: 7 }; continue }
    const col = P.cols[p]; if (!col || v === String(col.r)) continue;
    const pl = cap(PLACES[lang][p]); const n = v === "" ? null : Number(v);
    if (n !== null && col.cin && n === (col.tot - col.cin) % 10) { const parts = [...col.ds.map(String), `${col.cin} (${L().carryWord})`].join(" + "); return { text: pre + L().dAddCarry(pl, parts, col.tot, col.r), card: 7 } }
    return { text: pre + L().dGeneric(pl) + " " + colText(col), card: pre ? 5 : 7 };
  }
  return pre ? { text: pre, card: 5 } : null;
}
function colText(col) {
  const pl = PLACES[lang][col.p], pln = PLACES[lang][col.p + 1] || "";
  const parts = [...col.ds.map(String), ...(col.cin ? [`${col.cin} (${L().carryWord})`] : [])].join(" + ");
  return L().colAdd(cap(pl), parts, col.tot, col.r, col.cout, pln);
}
/* ---- tips ---- */
function onTip() {
  const P = ph(); const work = P.type === "steps" || P.type === "grid"; const max = work ? 3 : 2;
  if (tipLevel >= 3 && work) { reveal(); render(); return }
  tipLevel = Math.min(tipLevel + 1, max); if (tipLevel === 3) reveal(); render();
}
function reveal() {
  const P = ph(); task.helped = true;
  if (P.type === "steps") { const l = P.lines[lineIdx]; if (!l) return; entry = String(l.value); revealed = true; badMark = false; diag = null; return }
  if (P.type === "grid") {
    const t = P.cols.find(c => ent.res[c.p] === "" || ent.res[c.p] !== String(c.r)); if (!t) return;
    ent.res[t.p] = String(t.r); if (t.cout && t.p + 1 < P.W) ent.carry[t.p + 1] = String(t.cout); if (marks) marks[t.p] = null; diag = null;
    active = { role: "res", p: Math.min(t.p + 1, P.W - 1) };
  }
}
function tipText() {
  const P = ph(); const t = task; let s = `<b>${L().tip}:</b> `;
  if (P.type === "steps") {
    const l = P.lines[lineIdx];
    if (l.kind === "nround") { s += L().tipBook(L().pl10[l.pl]); if (tipLevel > 1) s += `<br><br>${task.mode === "book" ? L().tipBookPlace(Math.min(task.a, task.b), L().pl10[l.pl]) + "<br>" : ""}${L().tipBook2(l.n, down(l.n, l.pl), up(l.n, l.pl))}` }
    if (l.kind === "osum") s += L().dBookSum;
    if (l.kind === "round") { s += L().tipRound(l.s); if (tipLevel > 1) s += `<br><br>${L().tipRound2(l.p, down(l.p, l.s), up(l.p, l.s))}` }
    if (l.kind === "sum") { s += L().tipSum(l.s); if (tipLevel > 1) { let acc = l.ups[0]; const st = []; for (let i = 1; i < l.ups.length; i++) { st.push(`${fmt(acc)} + ${fmt(l.ups[i])} = ${fmt(acc + l.ups[i])}`); acc += l.ups[i] } s += `<br><br>${L().tipSum2(st.slice(0, -1).concat(st.length ? [st[st.length - 1].replace(/= [\d ]+$/, "= ?")] : []).join(" · "))}` } }
    if (l.kind === "rest") { s += L().tipRest; if (tipLevel > 1) s += `<br><br>${L().tipRest2(l.S, l.B)}` }
    if (l.kind === "probe") s += L().tipProbe;
  }
  else if (P.type === "grid") { s += L().tipGrid; if (tipLevel > 1) { const c = P.cols.find(c => ent.res[c.p] === "" || ent.res[c.p] !== String(c.r)); if (c) s += `<br><br>${colText(c)}` } }
  else if (P.type === "choice") {
    if (P.instr === "why1" || P.instr === "why2") s += L().tipWhy + (tipLevel > 1 ? `<br><br>${L().cards[2][1]}` : "");
    else if (P.instr === "decide") s += L().tipDecide;
    else if (P.instr === "final") s += L().tipFinal;
    else if (P.instr === "rough1") s += L().rough1Bad;
    else if (P.instr === "rough2") s += L().rough2Bad;
    else s += L().tipCan;
  }
  else if (P.type === "chips") s += L().tipNums;
  else if (P.type === "lines" || P.type === "reasons") s += L().tipLines;
  else if (P.type === "select") s += L().tipPlan;
  if (tipLevel > 2) s += `<br><br><b>${L().tip3}</b>`;
  return s;
}

/* ---- merk & cards ---- */
function renderMerk() {
  const p = el("section", "panel"); view.appendChild(p);
  p.appendChild(el("h2", "", L().merkTitle));
  const ol = el("ol"); L().merkRules.forEach(x => ol.appendChild(el("li", "", x))); const m = el("div", "rulebox"); m.appendChild(ol); p.appendChild(m);
  const e = el("div", "section"); e.style.marginTop = "18px"; e.appendChild(el("h3", "", L().errTitle));
  const list = el("div", "err"); L().errs.forEach(([t, x]) => list.appendChild(el("div", "erritem", `<span>${t}</span><span class="ex">${x}</span>`))); e.appendChild(list); p.appendChild(e);
  const g = el("div", "section"); g.appendChild(el("h3", "", L().glossTitle));
  const tbl = el("table", "gloss"); L().gloss.forEach(([a, b]) => tbl.appendChild(el("tr", "", `<td><b>${a}</b></td><td>${b}</td>`)));
  const tw = el("div", ""); tw.style.overflowX = "auto"; tw.appendChild(tbl); g.appendChild(tw); p.appendChild(g);
}
function renderCards() {
  const p = el("section", "panel"); view.appendChild(p);
  p.appendChild(el("h2", "", L().cardsTitle));
  const grid = el("div", "cards");
  L().cards.forEach(([q, a], i) => {
    const b = el("button", "fcard"); b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<div class="fin"><div class="face front"><span class="num">${i + 1}</span><span class="q">${q}</span><span class="hint">${L().tapHint}</span></div><div class="face back">${a}</div></div>`;
    b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
    grid.appendChild(b);
  });
  p.appendChild(grid);
}
document.getElementById("langbtn").onclick = () => { lang = lang === "de" ? "tr" : "de"; save(); render() };
/* Neu starten (wie im Kosten-Detektiv): erst tippen → „Wirklich alles löschen?“, innerhalb von 3,5 s nochmal tippen → alles löschen und neu laden */
let resetArmed = false, resetTimer = null;
function renderReset() { const b = document.getElementById("resetbtn"); b.textContent = resetArmed ? L().reset2 : L().reset; b.style.background = ""; b.style.borderColor = resetArmed ? "#E8892B" : ""; b.style.color = resetArmed ? "#FFD9B0" : "" }
document.getElementById("resetbtn").onclick = () => {
  if (!resetArmed) { resetArmed = true; renderReset(); clearTimeout(resetTimer); resetTimer = setTimeout(() => { resetArmed = false; renderReset() }, 3500); return }
  try { ["up-stats", "up-level", "up-seq", "up-plan", "up-partner"].forEach(k => localStorage.removeItem(k)) } catch (e) { }
  location.reload();
};
render();
</script>
