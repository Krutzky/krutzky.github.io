<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solar-Labor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout wie „Linsen-Labor“: Kopfleiste mit Stationen-Weg · links optische Bank + Dia- und Schirm-Ansicht mit Lineal (fest) · rechts Steuerpult + Stationsaufgabe. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --grid:#E3E8F0; --axis:#4A5068; --rail:#5B6278; --lens:#9CC3F0; --lens-edge:#3A6AA8; --ray1:#E8892B; --ray2:#1C66C0; --red:#E8432E;
  --room:#14161D; --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}

main{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.plot{position:static}}
canvas{display:block;width:100%;border-radius:10px;touch-action:none}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,250px));justify-content:center;gap:14px}
.view{display:flex;flex-direction:column;gap:4px;min-width:0}
.view canvas{aspect-ratio:1/1;max-width:100%;background:var(--room)}
.view small{font-size:13px;color:var(--ink-soft);text-align:center}
.view small b{color:var(--ink)}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}

/* Steuerpult */
.ctl{display:flex;flex-direction:column;gap:6px}
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:6px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:28px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.disp.g{color:#9FD0FF}
.keys{display:flex;gap:8px;align-items:center}
.key{width:56px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
input[type=range].gr{accent-color:var(--blue)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.locked{font-size:15px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.sep{border:0;border-top:1.5px dashed var(--line);margin:8px 0}

.num{width:4.6em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 4px;background:var(--surface);max-width:100%}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}
.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:440px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);grid-row:1/3}
.gopt span{font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.seg button.ok{background:var(--ok);color:#fff}
.seg button.bad{background:var(--bad);color:#fff}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.guess{border:2px solid var(--pro);background:var(--pro-soft);border-radius:12px;padding:12px}
.q{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.q p b{font-family:var(--f-display);font-weight:600}
.gap ol{padding-left:1.2em;margin:0}
.gap li{margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.merk{border:2px solid var(--blue);border-radius:12px;padding:14px;background:var(--surface)}
.merk h3{color:var(--blue);margin-bottom:6px}
.merk .k{color:var(--blue);font-weight:700}
textarea.free{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.bz{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.tw{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.mt th,table.mt td{border:1.5px solid var(--line);padding:6px 6px;text-align:center}
table.mt th{background:var(--surface-2);font-weight:700}
table.mt th small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
table.mt tr.cur td{background:var(--blue-soft)}
table.mt tr.done td{background:var(--ok-soft)}
table.mt tr.lock td{color:var(--ink-soft)}
table.mt td.v b{font-size:16px}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft);padding:0 6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.ctlrow{display:flex;flex-direction:column;gap:4px}
.ctlrow > span{font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px}
.seg.full{display:flex}
.seg.full button{flex:1}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.gopt span{font-size:15px}
</style>
<style>
.overlay{position:fixed;inset:0;background:rgba(2,12,69,.6);overflow:auto;padding:24px max(16px,env(safe-area-inset-left,0px));z-index:20}
.overlay .card{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

.view canvas{background:transparent}
#tCv{width:100%;display:block;border-radius:10px}
.opt:disabled{opacity:.6;cursor:not-allowed}
table.mt td input.num{width:4.2em}
table.mt tr{cursor:pointer}
.reset.t{border-color:#E8892B;color:#FFD9B0}
.abg-ov{position:fixed;inset:0;background:rgba(2,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:60}
.abg-box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abg-box h2{margin:0}
.abg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abg-in{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit}
.abg-copy{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.abg-fb{font-weight:700;min-height:1.4em}
.abg-fb.ok{color:var(--ok)} .abg-fb.bad{color:var(--bad)}
.savebtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;padding:6px 14px;font-size:14px}
.savebtn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,137,43,.7)}50%{box-shadow:0 0 0 8px rgba(232,137,43,0)}}
.dlg{position:fixed;inset:0;background:rgba(2,12,69,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:50;overflow-y:auto}
.dlgcard{max-width:640px;width:100%;margin-top:4vh}
.dlghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlghead h3{margin:0;font-family:var(--f-display);font-size:20px}
.xbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;font-size:20px;line-height:1;color:var(--ink)}
.stand{border-radius:12px;padding:10px 12px;background:var(--surface-2,var(--bg));font-size:15px}
.stand b{font-family:var(--f-display)}
.tipcard{border-left:4px solid var(--accent);}
.task-step{font-weight:700}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>Solar-Labor</b><span>Warum liefert das Balkonkraftwerk so wenig elektrische Leistung?</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="reset savebtn" id="saveOpen" type="button" aria-haspopup="dialog">Speichern</button>
    <button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>
<main>
  <section class="card plot" aria-label="Modell">
    <canvas id="cv" aria-label="Modell"></canvas>
    <div class="views" id="views">
      <div class="view"><canvas id="cvA"></canvas><small id="capA"></small></div>
      <div class="view"><canvas id="cvB"></canvas><small id="capB"></small></div>
    </div>
  </section>
  <aside class="side">
    <section class="card" id="ctlCard"><p class="eyebrow">Steuerpult</p><div id="ctl" class="ctl"></div></section>
    <section class="card stack" id="task"></section>
  </aside>
</main>

<div class="dlg" id="saveDlg" hidden role="dialog" aria-modal="true" aria-labelledby="saveTitle"><section class="card stack dlgcard" id="saveBody"></section></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var APP={mcLock:true,title:'Solar-Labor',file:'Solar-Labor',klasse:'10',proAfter:3,lesson:'Warum liefert das Balkonkraftwerk so wenig elektrische Leistung?',welcome:'Willkommen im Solar-Labor!',intro:'Heute findet ihr heraus, warum das Balkonkraftwerk von Familie K. so wenig elektrische Leistung liefert.'};
var KEY='solar-labor-v7',RKEY='solar-labor-resets',TKEY='solar-labor-klasse-v1';
var STATIONS=[
  {key:'s1',name:'Vorhersage',scene:'balcony'},
  {key:'s3',name:'Messen',scene:'setup'},
  {key:'s4',name:'Auswerten',scene:'setup'},
  {key:'s5',name:'Schlussfolgerung',scene:'balcony'},
  {key:'s6',name:'Profi-Zusatz',pro:true,scene:'setup'},
  {key:'s7',name:'Ergebnisse sichern',scene:'balcony'}
];
function SI(k){for(var i=0;i<STATIONS.length;i++)if(STATIONS[i].key===k)return i;return -1;}
function SK(){return STATIONS[st.station]?STATIONS[st.station].key:'';}
var FAMW=20;/* so viel Watt zeigt die App von Familie K. heute: alle vier Ursachen zusammen */
/* Abschattungs-Muster: Anteil der abgedeckten Fläche je Zelle (4 Zellen in Reihe) */
function base(){return {h:1000,a:0,n:0,s:0,v:0};}
var KU=20,KI=40;/* Anzeige wie ein echtes 400-W-Balkonmodul */
var UNIT={s:'%',n:'g/m²',h:'W/m²',a:'°'};
var GROUPS={
  A:{rank:'Schatten',name:'Abschattung',lvl:'Basis',p:'s',col:'#1A1F36',head:'Schatten auf Zelle 1 (in % der Zellfläche)',famV:100,famLab:'eine ganze Zelle im Schatten',
     fam:'Mittags liegt eine ganze Zelle im Schatten des Nachbarbalkons.',task:'Der Nachbarbalkon wirft Schatten auf das Modul. Ihr untersucht, wie die Schattenfläche auf einer Zelle die Leistung verändert.',
     rule:{min:5,max:100,order:1,need:100,ext:null,unit:'%',ex:['25','50','100'],step:5,stepTxt:'Im Steuerpult geht der Schatten in 5-%-Schritten. Wählt Werte wie 25 %, 50 % oder 75 %.',txt:'Wählt 3 Schattenflächen auf Zelle 1 zwischen 5 % und 100 % (in 5-%-Schritten), aufsteigend. <b>100 %</b> (die ganze Zelle wie bei Familie K.) muss dabei sein. Die App ergänzt danach eine Vergleichsmessung: gleich viel Schatten, aber ein Stück auf jeder der 4 Zellen.'}},
  B:{rank:'Staub',name:'Verschmutzung',lvl:'Basis',p:'n',col:'#B05A12',head:'Staub auf dem Modul in g/m²',famV:2,famLab:'dünne Staubschicht (2 g/m²)',
     fam:'Auf dem Modul liegt eine dünne Staubschicht von etwa 2 g/m².',task:'Auf dem Modul sammelt sich Staub. Ihr untersucht, wie die Staubmenge die Leistung verändert.',

  C:{rank:'Dunst (schwächeres Licht)',name:'Dunst',lvl:'Standard',p:'h',col:'#1C66C0',head:'Sonnenlicht in W/m²',famV:700,famLab:'leichter Dunst (700 W/m²)',

  var s=st.set,topH=H*0.56,ink=col('ink'),hz=s.h/1000,a=s.a*Math.PI/180,hl=s.h>=950?0:s.h>=600?1:s.h>=400?2:3;
  /* Himmel mit Dunst */
  var g=ctx.createLinearGradient(0,0,0,topH);g.addColorStop(0,'#BFD9F2');g.addColorStop(1,'#E8F1FA');ctx.fillStyle=g;ctx.fillRect(0,0,W,topH);
  ctx.fillStyle='rgba(205,208,214,'+((1-hz)*0.85)+')';ctx.fillRect(0,0,W,topH);
  /* Sonne */
  var sx=W*0.90,sy=topH*0.17;ctx.save();ctx.globalAlpha=0.3+0.7*hz;ctx.fillStyle='#F5B82E';ctx.beginPath();ctx.arc(sx,sy,18,0,Math.PI*2);ctx.fill();
  for(var k=0;k<10;k++){var an=k*Math.PI/5;line(sx+Math.cos(an)*24,sy+Math.sin(an)*24,sx+Math.cos(an)*32,sy+Math.sin(an)*32,'#F5B82E',3);}ctx.restore();
  if(hl>=2){ctx.fillStyle='rgba(255,255,255,'+(hl===3?0.92:0.6)+')';[[0.83,0.14,34],[0.91,0.22,28],[0.97,0.13,24]].forEach(function(c){ctx.beginPath();ctx.ellipse(W*c[0],topH*c[1],c[2]*1.6,c[2]*0.7,0,0,Math.PI*2);ctx.fill();});}
  /* Hauswand und Balkone */
  var ww=W*0.70;ctx.fillStyle='#E7DCCB';ctx.fillRect(0,0,ww,topH);ctx.strokeStyle='#CDBFA8';ctx.lineWidth=1;for(var yy=16;yy<topH;yy+=20){ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(ww,yy);ctx.stroke();}
  var nbY=topH*0.06;ctx.fillStyle='#9AA3B5';ctx.fillRect(0,nbY,ww*0.98,12);ctx.fillStyle='#6B7280';ctx.font=font(11,true);ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('Balkon der Nachbarn',8,nbY+14);
  var by=topH*0.80;ctx.fillStyle='#B9C2D0';ctx.fillRect(0,topH-8,ww,8);line(0,by,ww,by,'#5B6278',4);for(var x=10;x<ww;x+=16)line(x,by,x,topH-8,'#5B6278',2);
  /* Modul von vorne am Geländer (Breite zeigt die Schräge) */
  var mwFull=ww*0.62,mw=mwFull*Math.max(0.16,Math.cos(a)),mh=topH*0.46,mx=ww*0.10+(mwFull-mw)/2,my=by-mh*0.86,cw=mw/4,sh=s.v?[s.s/400,s.s/400,s.s/400,s.s/400]:[s.s/100,0,0,0];
  paintPanel(ctx,mx,my,mw,mh,s.s/100,s.v,s.n,false);
  if(s.n>0){ctx.fillStyle='rgba(150,120,80,.7)';for(var d2=0;d2<Math.round(18*s.n);d2++){var hx=fnv('st'+d2),px=parseInt(hx.slice(0,4),16)/65535*mw,py=parseInt(hx.slice(4),16)/65535*mh;ctx.beginPath();ctx.arc(mx+px,my+py,1.3,0,Math.PI*2);ctx.fill();}}
  ctx.strokeStyle='#D1D5DB';ctx.lineWidth=3;ctx.strokeRect(mx,my,mw,mh);
  if(s.s>0){ctx.fillStyle='rgba(10,14,30,.10)';ctx.beginPath();ctx.moveTo(ww*0.45,nbY+12);ctx.lineTo(ww*0.98,nbY+12);ctx.lineTo(mx+mw,my);ctx.lineTo(mx+mw*0.5,my);ctx.closePath();ctx.fill();}
  tag('Balkonmodul · 4 Zellen in Reihe',ww*0.10+mwFull/2,my-12,ink);
  /* Seitenansicht: Einfallswinkel zwischen Strahlen und Lot */
  var bx=W*0.72,bw=W*0.27,bty=topH*0.42,bh=topH*0.55;rrect(ctx,bx,bty,bw,bh,10);ctx.fillStyle='rgba(255,255,255,.92)';ctx.fill();ctx.strokeStyle=col('line');ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=col('ink-soft');ctx.font=font(11,true);ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('Von der Seite',bx+8,bty+6);
  var cx=bx+bw*0.32,cy=bty+bh*0.58,L2=bh*0.32;
  for(var r=-1;r<=1;r++)line(bx+bw-10,cy+r*L2*0.5,cx+8,cy+r*L2*0.5,'#F5B82E',2,[6,4]);
  ctx.save();ctx.lineCap='round';ctx.strokeStyle='#1E3A6E';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(cx-Math.sin(a)*L2,cy-Math.cos(a)*L2);ctx.lineTo(cx+Math.sin(a)*L2,cy+Math.cos(a)*L2);ctx.stroke();ctx.restore();
  line(cx,cy,cx+Math.cos(a)*L2*1.05,cy-Math.sin(a)*L2*1.05,'#6B3FB0',1.6,[4,3]);ctx.fillStyle='#6B3FB0';ctx.font=font(10,true);ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillText('Lot',cx+Math.cos(a)*L2*1.08,cy-Math.sin(a)*L2*1.08);
  if(s.a>0){ctx.save();ctx.strokeStyle='#6B3FB0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,L2*0.6,0,-a,true);ctx.stroke();ctx.restore();}
  tag(fmt(s.a,0)+'°',cx+bw*0.30,bty+bh*0.88,'#6B3FB0');
  tag(['klarer Himmel','leichter Dunst','Dunst','Wolken'][hl]+' · '+fmt(s.h,0)+' W/m²',W-8,bty-14,'#1C66C0','right');
  drawCircuit(topH);
  renderSetupViews();
}
function meter(x,y,w,h,label,val,unit){rrect(ctx,x,y,w,h,10);ctx.fillStyle='#111111';ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#9a9a9a';ctx.font=font(10,true);ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(label,x+w/2,y+5);
  ctx.fillStyle=label.charAt(0)==='S'?'#9FD0FF':'#FFC94D';ctx.font='bold '+Math.round(h*0.40)+'px ui-monospace,Menlo,Consolas,monospace';ctx.textBaseline='middle';ctx.fillText(val+' '+unit,x+w/2,y+h*0.62);}
function drawCircuit(topH){var y0=topH+12,h=H-topH-20,soft=col('ink-soft'),ink=col('ink');
  ctx.font=font(12,true);ctx.fillStyle=soft;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('Schaltung',10,topH+6);
  var x1=W*0.08,x2=W*0.48,ya=y0+h*0.30,yb=y0+h*0.85;
  ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.strokeRect(x1,ya,x2-x1,yb-ya);
  /* Modul-Symbol */
  ctx.fillStyle=col('surface');ctx.fillRect(x1-14,(ya+yb)/2-16,28,32);ctx.strokeRect(x1-14,(ya+yb)/2-16,28,32);ctx.fillStyle='#1E3A6E';ctx.fillRect(x1-9,(ya+yb)/2-11,18,22);
  /* Amperemeter oben, Widerstand rechts, Voltmeter parallel unten */
  function circ(cx,cy,t){ctx.fillStyle=col('surface');ctx.beginPath();ctx.arc(cx,cy,13,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=ink;ctx.font=font(13,true);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,cx,cy+1);}
  var bld=false,sl1=bld?(st.s2.slot1||'?'):'A',sl2=bld?(st.s2.slot2||'?'):'V';circ((x1+x2)/2,ya,sl1);if(bld){ctx.fillStyle='#E8892B';ctx.font=font(12,true);ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('①',(x1+x2)/2,ya-16);}ctx.fillStyle=col('surface');ctx.fillRect(x2-9,(ya+yb)/2-20,18,40);ctx.strokeRect(x2-9,(ya+yb)/2-20,18,40);
  ctx.fillStyle=soft;ctx.font=font(11,true);ctx.textAlign='left';ctx.textAlign='right';ctx.fillText('Last',x2-14,(ya+yb)/2);var xr=x2+Math.max(34,W*0.05);ctx.beginPath();ctx.moveTo(x2,ya);ctx.lineTo(xr,ya);ctx.lineTo(xr,yb);ctx.lineTo(x2,yb);ctx.stroke();ctx.fillStyle=ink;ctx.beginPath();ctx.arc(x2,ya,3.5,0,Math.PI*2);ctx.arc(x2,yb,3.5,0,Math.PI*2);ctx.fill();circ(xr,(ya+yb)/2,sl2);if(bld){ctx.fillStyle='#E8892B';ctx.font=font(12,true);ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('②',xr,(ya+yb)/2-16);}
  var m=meas(st.set),mx=W*0.58,mw=Math.min(170,(W-mx-26)/2),mh=Math.min(h*0.70,70);
  meter(mx,y0+h*0.08,mw,mh,'SPANNUNG U',m?fmt(m.U,1):'–,–','V');meter(mx+mw+12,y0+h*0.08,mw,mh,'STROMSTÄRKE I',m?fmt(m.I,2):'–,––','A');
  ctx.fillStyle=soft;ctx.font=font(11);ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(m?'Messwerte im Modell ablesen':'Erst die Schaltung richtig bauen',mx,y0+h*0.08+mh+6);
}

/* Ganze Platte mit Schatten: mode 0 = Schatten auf Zelle 1 (Anteil f), mode 1 = je ein Streifen auf allen 4 Zellen (zusammen f Zellen) */
function paintPanel(c,x,y,w,h,f,mode,dust,big){var fr=Math.max(3,w*0.02),ix=x+fr,iy=y+fr,iw=w-2*fr,ih=h-2*fr,cw=iw/4,gap=Math.max(2,w*0.012);
  c.fillStyle='#AEB6C4';c.fillRect(x,y,w,h);c.strokeStyle='#6B7280';c.lineWidth=Math.max(1,w/300);c.strokeRect(x,y,w,h);
  for(var i=0;i<4;i++){var cx=ix+i*cw+gap/2,cwi=cw-gap;c.fillStyle='#2F5DAA';c.fillRect(cx,iy,cwi,ih);
    c.strokeStyle='rgba(190,215,250,.55)';c.lineWidth=Math.max(1,w/400);for(var g=1;g<4;g++){c.beginPath();c.moveTo(cx,iy+ih*g/4);c.lineTo(cx+cwi,iy+ih*g/4);c.stroke();c.beginPath();c.moveTo(cx+cwi*g/4,iy);c.lineTo(cx+cwi*g/4,iy+ih);c.stroke();}
    if(dust>0){c.fillStyle='rgba(205,185,145,'+Math.min(0.75,0.05*dust)+')';c.fillRect(cx,iy,cwi,ih);}
    var sf=mode?f/4:(i===0?f:0);
    if(sf>0){var sh=ih*Math.min(1,sf);var sy=iy+ih-sh;c.fillStyle='rgba(8,10,20,.88)';c.fillRect(cx,sy,cwi,sh);
      c.save();c.beginPath();c.rect(cx,sy,cwi,sh);c.clip();c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=Math.max(1,w/250);for(var k=-ih;k<cwi+ih;k+=Math.max(6,w/40)){c.beginPath();c.moveTo(cx+k,sy);c.lineTo(cx+k-sh,sy+sh);c.stroke();}c.restore();
      c.strokeStyle='#F5B82E';c.lineWidth=Math.max(1.5,w/160);c.setLineDash([Math.max(3,w/60),Math.max(2,w/90)]);c.strokeRect(cx+1,sy+1,cwi-2,sh-2);c.setLineDash([]);}
    var lit=!(sf>=0.999);c.fillStyle=lit?'#FFFFFF':'#F5B82E';c.font='bold '+Math.round(Math.min(cwi*0.42,ih*(big?0.3:0.5)))+'px '+ff();c.textAlign='center';c.textBaseline='middle';
    var ty=sf>0&&sf<0.999?iy+ih*(1-sf)/2:iy+ih/2;c.fillText(String(i+1),cx+cwi/2,ty);}}
function renderSetupViews(){
  $('capA').innerHTML='<b>Modul von vorne</b> (aus Sicht der Sonne)';$('capB').innerHTML=st.grp?'<b>Eure Messreihe</b> · Leistung in % der Referenz':'<b>Eure Messreihe</b>';
  var A=vctx('cvA'),x=A.x,w=A.w,s=st.set;x.fillStyle='#F4F1EA';x.fillRect(0,0,w,w);
  var mw=w*0.9*Math.max(0.12,Math.cos(s.a*Math.PI/180)),mh=w*0.46,mx=(w-mw)/2,my=w*0.2;
  paintPanel(x,mx,my,mw,mh,s.s/100,s.v,s.n,true);
  var L1,L2;if(s.s>0&&!s.v){L1=s.s===100?'Zelle 1 ist ganz dunkel.':'Zelle 1 ist zu '+fmt(s.s,0)+' % dunkel.';L2='Zelle 2, 3 und 4 sind hell.';}
  else if(s.s>0){L1='Jede Zelle ist ein Stück dunkel.';L2=s.s===100?'Zusammen so viel wie 1 Zelle.':'Zusammen '+fmt(s.s,0)+' % von 1 Zelle.';}
  else{L1=s.n?valLabel('n',s.n):'Kein Schatten auf dem Modul.';L2='';}
  x.fillStyle='#0B1442';x.font='bold '+Math.round(w/18)+'px '+ff();x.textAlign='center';x.textBaseline='top';x.fillText(L1,w/2,w*0.05);
  x.fillStyle='#4E5677';x.font=Math.round(w/17)+'px '+ff();if(L2)x.fillText(L2,w/2,my+mh+w*0.04);
  if(s.s>0){x.fillStyle='#08080F';x.fillRect(w*0.2,w*0.83,w*0.05,w*0.05);x.fillStyle='#4E5677';x.textAlign='left';x.fillText('= Schatten',w*0.27,w*0.825);}
  x.textAlign='center';x.font=Math.round(w/20)+'px '+ff();x.fillText('Die Zellen sind in Reihe geschaltet.',w/2,w*0.92);
  drawGraph();
}
function drawGraph(){var B=vctx('cvB'),y=B.x,w=B.w;y.fillStyle='#FFFFFF';y.fillRect(0,0,w,w);var F=ff();
  if(!st.grp){y.fillStyle='#4E5677';y.font=Math.round(w/16)+'px '+F;y.textAlign='center';y.textBaseline='middle';y.fillText('Wählt zuerst eure Gruppe.',w/2,w/2);return;}
  var g=G(),vals=rowVals(),L=w*0.16,R=w*0.95,T=w*0.08,Bt=w*0.78;function Y(p){return Bt-(Math.min(120,p)/110)*(Bt-T);}
  y.strokeStyle='#E3E8F0';y.lineWidth=1;y.fillStyle='#4E5677';y.font=Math.round(w/22)+'px '+F;y.textAlign='right';y.textBaseline='middle';
  [0,25,50,75,100].forEach(function(p){y.beginPath();y.moveTo(L,Y(p));y.lineTo(R,Y(p));y.stroke();y.fillText(p+' %',L-4,Y(p));});
  var cat=g.p==='s',n=vals.length;
  var xs=vals.map(function(v,i){if(cat)return L+(i+0.5)*(R-L)/n;var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);return L+(hi>lo?(v-lo)/(hi-lo):0)*(R-L)*0.9+(R-L)*0.05;});
  y.textAlign='center';y.textBaseline='top';y.fillStyle='#4E5677';
  vals.forEach(function(v,i){var lab=g.p==='s'?(v===-1?'alle 4':fmt(v,0)+' %'):g.p==='n'?fmt(v,1):fmt(v,0)+(g.p==='a'?'°':'');y.fillText(lab,xs[i],Bt+w*0.02);});
  y.fillText(g.p==='s'?'Schatten auf Zelle 1':g.p==='n'?'Staub in g/m²':g.p==='h'?'Sonnenlicht in W/m²':'Einfallswinkel in °',(L+R)/2,Bt+w*0.10);
  /* Vorhersage */
  var fi=vals.indexOf(g.famV);if(false){y.strokeStyle='#6B3FB0';y.lineWidth=w/150;y.setLineDash([w/50,w/80]);y.beginPath();y.moveTo(xs[fi]-w*0.06,Y(st.pred));y.lineTo(xs[fi]+w*0.06,Y(st.pred));y.stroke();y.setLineDash([]);y.fillStyle='#6B3FB0';y.textAlign='center';y.textBaseline='bottom';y.fillText('Vorhersage',xs[fi],Y(st.pred)-3);}
  var showP=true;var pts=vals.map(function(v,i){return (!showP||isNaN(pct(i)))?null:[xs[i],Y(pct(i)),pct(i)];});
  if(cat){pts.forEach(function(p,i){if(!p)return;var bw=(R-L)/n*0.55;y.fillStyle=(i===st.row&&SK()==='s3')?'#E8892B':g.col;y.fillRect(p[0]-bw/2,p[1],bw,Bt-p[1]);y.fillStyle='#1A1F36';y.textAlign='center';y.textBaseline='bottom';y.font='bold '+Math.round(w/20)+'px '+F;y.fillText(fmt(p[2],0)+' %',p[0],p[1]-2);y.font=Math.round(w/22)+'px '+F;});}
  else{y.strokeStyle=g.col;y.lineWidth=w/120;y.beginPath();var first=true;pts.forEach(function(p){if(!p)return;if(first){y.moveTo(p[0],p[1]);first=false;}else y.lineTo(p[0],p[1]);});y.stroke();
    pts.forEach(function(p,i){if(!p)return;y.fillStyle=(i===st.row&&SK()==='s3')?'#E8892B':g.col;y.beginPath();y.arc(p[0],p[1],w/55,0,Math.PI*2);y.fill();y.fillStyle='#1A1F36';y.textAlign='center';y.textBaseline='bottom';y.font='bold '+Math.round(w/22)+'px '+F;y.fillText(fmt(p[2],0),p[0],p[1]-w/40);y.font=Math.round(w/22)+'px '+F;});}
  if(!pts.some(function(p){return p;})){y.fillStyle='#4E5677';y.textAlign='center';y.textBaseline='middle';y.fillText(showP?'Noch keine Messwerte':'Erscheint nach dem Anteil für Familie K.',(L+R)/2,T+(Bt-T)*0.2);}
}

var REFLAB={s:'kein Schatten',n:'sauberes Modul (0 g/m²)',h:'klarer Himmel (1000 W/m²)',a:'Strahlen senkrecht auf das Modul (0°)'};
function ctlFor(k){if(k==='a')return slider('W','EINFALLSWINKEL',st.set.a+'°',0,85,1,st.set.a,'0°','85°','g');
  if(k==='n')return slider('N','STAUB AUF DEM MODUL',fmt(st.set.n,1)+' g/m²',0,15,0.5,st.set.n,'0','15 g/m²','g');
  if(k==='h')return slider('H','SONNENLICHT',st.set.h+' W/m²',0,1000,50,st.set.h,'0','1000 W/m²','g');
  return slider('S','SCHATTEN AUF ZELLE 1 (100 % = ganze Zelle)',st.set.s+' %'+(st.set.s===100?' · ganze Zelle':''),0,100,5,st.set.s,'0 %','100 %','g')+'<div class="ctlrow"><span>SCHATTEN LIEGT</span>'+segHTML('sgv',[[0,'nur auf Zelle 1'],[1,'ein Stück auf jeder Zelle']],st.set.v)+'</div>';}
function renderCtl(){var sc=STATIONS[st.station].scene,h='',pro=STATIONS[st.station].key==='s6';
  if(sc==='balcony'){h=(SK()==='s5'||SK()==='s7')?'<p class="muted">Im Bild sind die vier möglichen Ursachen markiert. Hier wird nicht gemessen.</p>':'<label class="chk"><input type="checkbox" id="tCause"'+(st.showCauses?' checked':'')+'> Auffälligkeiten am Balkon markieren</label><p class="muted">Schaut euch das Bild genau an: Was könnte die Leistung verringern?</p>';}
  else if(STATIONS[st.station].key==='s4'){h='<p class="muted">In dieser Station wird nicht gemessen. Schaut auf eure Tabelle und euren Graphen.</p>';}
  else if(pro){h='<div class="row"><button class="btn sec" type="button" id="toRef">Alles auf Referenz zurücksetzen</button></div>'+['s','n','h','a'].map(ctlFor).join('')+'<p class="muted">Profi: Hier sind alle vier Faktoren frei. Stellt für eine Messung immer nur einen Faktor ein und setzt danach alles wieder auf die Referenz.</p>';}
  else if(st.grp){var p=G().p;h=[p].concat(['s','n','h','a'].filter(function(k){return k!==p;})).map(ctlFor).join('')+'<p class="muted">Alle vier Regler lassen sich verstellen. Ihr entscheidet selbst, was ihr verändert und was gleich bleibt. Euer Regler steht oben.</p>';}

  if($('tCause'))$('tCause').addEventListener('change',function(){st.showCauses=this.checked;draw();});

  if($('NS'))bindSlider('N',function(){return st.set.n;},function(v){st.set.n=Math.round(v*2)/2;$('dispN').textContent=fmt(st.set.n,1)+' g/m²';},0.5,0,15);
  if($('HS'))bindSlider('H',function(){return st.set.h;},function(v){st.set.h=v;$('dispH').textContent=v+' W/m²';},50,0,1000);
  if($('SS'))bindSlider('S',function(){return st.set.s;},function(v){st.set.s=v;$('dispS').textContent=v+' %'+(v===100?' · ganze Zelle':'');},5,0,100);
  bindSeg('sgv',function(v){st.set.v=+v;draw();});
}

/* Hilfsfunktionen für die Messreihe */
var REFSET=base();
function valSet(p,v){var x=base();if(p==='s'&&v===-1){x.s=100;x.v=1;}else x[p]=v;return x;}
function rowSet(i){return valSet(G().p,rowVals()[i]);}
function sameSet(a,b){return a.h===b.h&&a.a===b.a&&a.n===b.n&&a.s===b.s&&(a.s===0||a.v===b.v);}

var FNAME={s:'den Schatten',n:'den Staub',h:'das Sonnenlicht',a:'den Winkel'};
var FDAT={s:'dem Schatten',n:'dem Staub',h:'dem Sonnenlicht',a:'dem Winkel'};

function vglBox(short){return '<div class="merk"><h3>So werden alle Ergebnisse vergleichbar</h3><ol style="margin:0;padding-left:1.2em"><li><b>Referenz</b> messen: beste Bedingungen. Ihre Leistung P<sub>Ref</sub> sind <b>100 %</b>.</li><li><b>Fairer Versuch:</b> Nur euer Faktor ändert sich, alles andere bleibt gleich. <b>Darauf achtet ihr selbst:</b> Im Steuerpult lassen sich alle Regler verstellen.</li><li><b>Anteil = P : P<sub>Ref</sub> · 100 %</b>. So kann man die Ergebnisse aller Gruppen vergleichen.</li></ol>'+(short?'':'<p class="muted" style="margin:6px 0 0">Tragt alles auch auf eurem Gruppen-AB ein.</p>')+'</div>';}
function factorPhrase(p){return p==='s'?'den Schatten':p==='n'?'den Staub':p==='h'?'das Wetter (Dunst)':'den Einfallswinkel';}

  s2steps:['Wählt Werte mit deutlichem Abstand zueinander, dann wird der Graph gut lesbar. Der Wert von Familie K. muss dabei sein.','Schaut auf die Bedingungen in der Aufgabe: Bereich, Reihenfolge, Pflichtwert.'],

  s5why:['Schaut auf das Klassenergebnis an der Tafel (Aufgabe 3 im AB): Welcher Faktor lässt am wenigsten Leistung übrig?','Satzanfang: „Familie K. sollte zuerst …, weil …“']
};
function slotSegUNUSED(id,v,dis){return '<span class="seg" data-slot="'+id+'">'+[['A','Amperemeter (A)'],['V','Voltmeter (V)']].map(function(o){return '<button type="button" data-v="'+o[0]+'" class="'+(v===o[0]?'sel':'')+'"'+(dis?' disabled':'')+'>'+o[1]+'</button>';}).join('')+'</span>';}
/* Station 3: Messen */
var FWORD={s:'Schatten',n:'Staub',h:'Sonnenlicht',a:'Einfallswinkel'};
function rowDone(i){var r=st.s3.rows[i];return !!(r&&r.U&&r.I&&r.P);}
function bubbleInfo(i){var s=st.s3,g=G(),p=g.p,want=rowSet(i),r=s.rows[i]||{},v=rowVals()[i],m=meas(st.set);
  var ownOk=st.set[p]===want[p]&&(p!=='s'||st.set.v===want.v||st.set.s===0);
  var lbl=rowLabel(v,i).replace(' (Referenz)','');
  if(!ownOk){var how=v===-1?'Schatten auf <b>100 %</b> und darunter <b>„ein Stück auf jeder Zelle“</b>':'<b>'+FWORD[p]+'</b> auf <b>'+(p==='s'?v+' %':p==='n'?fmt(v,1)+' g/m²':p==='h'?v+' W/m²':v+'°')+'</b>'+(p==='s'&&st.set.v===1?' und <b>„nur auf Zelle 1“</b>':'');
    return {c:0,t:'<b>Regler einstellen:</b> Stellt unten im Steuerpult '+how+'.'};}
  var off=offKeys(st.set,p);
  if(off.length)return {c:0,t:'<b>Achtung:</b> '+off.map(function(k){return FWORD[k];}).join(' und ')+' steht nicht auf dem besten Wert. Stellt nur euren eigenen Regler um, sonst ist der Versuch nicht fair.'};
  var mu=meas(want),U=num(r.U),I=num(r.I),P=num(r.P);
  if(r.U&&!uOk(U,mu.U))return {c:1,t:'<b>Die Spannung passt nicht.</b> Schaut noch einmal auf das Messgerät „Spannung U“ und verbessert die Zahl. Achtet auf das Komma.<span class="mini">Spannung U zeigt jetzt: <b>'+fmt(m.U,1)+' V</b></span>'};
  if(r.I&&!iOk(I,mu.I))return {c:2,t:'<b>Die Stromstärke passt nicht.</b> Schaut noch einmal auf das Messgerät „Stromstärke I“ und verbessert die Zahl. Achtet auf das Komma.<span class="mini">Stromstärke I zeigt jetzt: <b>'+fmt(m.I,2)+' A</b></span>'};
  if(r.P&&!isNaN(U)&&!isNaN(I)&&!prOk(P,U,I))return {c:3,t:'<b>P stimmt noch nicht.</b> Rechnet noch einmal P = U · I = '+esc(r.U)+' · '+esc(r.I)+'. Der Taschenrechner hilft (unten rechts).'};
  if(!r.U)return {c:1,t:(i===0?'<b>Das ist die Referenz:</b> beste Bedingungen, alle Regler auf dem besten Wert. Ihr müsst nichts verstellen.<br>':'')+'<b>Spannung U ablesen:</b> Schaut im Bild auf das schwarze Messgerät <b>„Spannung U“</b>. Tippt die Zahl hier ein.<span class="mini">Spannung U zeigt jetzt: <b>'+fmt(m.U,1)+' V</b></span>'};
  if(!r.I)return {c:2,t:'<b>Stromstärke I ablesen:</b> Schaut im Bild auf das schwarze Messgerät <b>„Stromstärke I“</b>. Tippt die Zahl hier ein.<span class="mini">Stromstärke I zeigt jetzt: <b>'+fmt(m.I,2)+' A</b></span>'};
  if(!r.P)return {c:3,t:'<b>Jetzt rechnet ihr:</b> P = U · I mit euren Werten. Tippt das Ergebnis hier ein. Der Taschenrechner hilft (unten rechts).'};
  return {c:-1,t:'<b>Zeile fertig!</b> '+(rowVals().some(function(x,j){return !rowDone(j);})?'Weiter mit der nächsten Zeile.':'Alle Zeilen sind ausgefüllt. Tippt unten auf „Messwerte und Rechnungen prüfen“.')};}
function rowProblem(i){var r=st.s3.rows[i]||{},p=G().p,m=meas(rowSet(i)),U=num(r.U),I=num(r.I),P=num(r.P);
  if((r.U||r.I)&&offKeys(st.set,p).length)return true;
  if(r.U&&!uOk(U,m.U))return true;
  if(r.I&&!iOk(I,m.I))return true;
  if(r.P&&!isNaN(U)&&!isNaN(I)&&!prOk(P,U,I))return true;
  return !!(st.s3.flag&&st.s3.flag[i]);}
function bubbleMode(i){var b=bubbleInfo(i);
  return (i===0&&b.c>=0&&b.c<=2)?'auto':'';}
function updBubble(){var tb=document.querySelector('table.mt tbody');if(!tb||st.s3.ok)return;
  Array.prototype.forEach.call(tb.querySelectorAll('tr.bub'),function(x){x.parentNode.removeChild(x);});
  if(rowDone(st.row)&&!rowProblem(st.row)){var n=-1;rowVals().forEach(function(x,j){if(n<0&&j>st.row&&!rowDone(j))n=j;});if(n<0)rowVals().forEach(function(x,j){if(n<0&&!rowDone(j))n=j;});
    if(n>=0&&n!==st.row){st.row=n;Array.prototype.forEach.call(tb.querySelectorAll('[data-row]'),function(t,j){t.className=j===n?'cur':(rowDone(j)?'done':'');});}}
  var tr=tb.querySelector('[data-row="'+st.row+'"]');if(!tr)return;var mode=bubbleMode(st.row);if(!mode)return;
  var nr=document.createElement('tr');nr.className='bub';
  var b=bubbleInfo(st.row),ax=[18,47,62,77,92][Math.max(0,b.c)];
  nr.innerHTML='<td colspan="5"><div class="bubble" style="--ax:'+ax+'%">'+b.t+'</div></td>';
  tr.parentNode.insertBefore(nr,tr.nextSibling);}
function fairInfo(){var want=rowSet(st.row),v=rowVals()[st.row];
  if(sameSet(st.set,want))return '<p class="note">Zeile '+(st.row+1)+' ('+rowLabel(v,st.row).replace(' (Referenz)','')+'): Euer Faktor steht richtig. Lest U und I ab.</p>';
  if(st.set[G().p]===want[G().p]&&(G().p!=='s'||st.set.v===want.v))return '<p class="note">Zeile '+(st.row+1)+': Euer Faktor steht richtig. Ist der Versuch fair?</p>';
  return '<p class="note">Zeile '+(st.row+1)+': Stellt euren Faktor im Steuerpult auf <b>'+rowLabel(v,st.row).replace(' (Referenz)','')+'</b>.</p>';}
/* Prüfung genau wie die Anzeige: U mit 1 Nachkommastelle; I mit 2 oder richtig gerundet mit 1 Nachkommastelle */
function near(a,b){return Math.abs(a-b)<1e-6;}
function uOk(U,mU){return !isNaN(U)&&near(U,Math.round(mU*10)/10);}
function iOk(I,mI){if(isNaN(I))return false;var d2=Math.round(mI*100)/100,d1=Math.round(d2*10)/10;return near(I,d2)||near(I,d1);}
function prOk(P,U,I){return !isNaN(P)&&Math.abs(P-U*I)<=0.55;}
function measOk(set,U,I){var m=meas(set);return uOk(num(U),m.U)&&iOk(num(I),m.I);}
function rowOk(i){var r=st.s3.rows[i];return measOk(rowSet(i),r.U,r.I);}
function pOk(i){var r=st.s3.rows[i],U=num(r.U),I=num(r.I),P=num(r.P);return !isNaN(U)&&!isNaN(I)&&prOk(P,U,I);}
