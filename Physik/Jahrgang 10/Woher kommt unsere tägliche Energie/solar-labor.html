<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Solar-Labor</title>

<style>
/* Layout wie „Linsen-Labor“: Kopfleiste mit Stationen-Weg · links optische Bank + Dia- und Schirm-Ansicht mit Lineal (fest) · rechts Steuerpult + Stationsaufgabe. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --grid:#E3E8F0; --axis:#4A5068; --rail:#5B6278; --lens:#9CC3F0; --lens-edge:#3A6AA8; --ray1:#E8892B; --ray2:#1C66C0; --red:#E8432E;
  --room:#14161D; --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}

main{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.plot{position:static}}
canvas{display:block;width:100%;border-radius:10px;touch-action:none}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,250px));justify-content:center;gap:14px}
.view{display:flex;flex-direction:column;gap:4px;min-width:0}
.view canvas{aspect-ratio:1/1;max-width:100%;background:var(--room)}
.view small{font-size:13px;color:var(--ink-soft);text-align:center}
.view small b{color:var(--ink)}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}

/* Steuerpult */
.ctl{display:flex;flex-direction:column;gap:6px}
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:6px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:28px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.disp.g{color:#9FD0FF}
.keys{display:flex;gap:8px;align-items:center}
.key{width:56px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
input[type=range].gr{accent-color:var(--blue)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.locked{font-size:15px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.sep{border:0;border-top:1.5px dashed var(--line);margin:8px 0}

.num{width:4.6em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 4px;background:var(--surface);max-width:100%}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}
.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:440px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);grid-row:1/3}
.gopt span{font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.seg button.ok{background:var(--ok);color:#fff}
.seg button.bad{background:var(--bad);color:#fff}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.guess{border:2px solid var(--pro);background:var(--pro-soft);border-radius:12px;padding:12px}
.q{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.q p b{font-family:var(--f-display);font-weight:600}
.gap ol{padding-left:1.2em;margin:0}
.gap li{margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.merk{border:2px solid var(--blue);border-radius:12px;padding:14px;background:var(--surface)}
.merk h3{color:var(--blue);margin-bottom:6px}
.merk .k{color:var(--blue);font-weight:700}
textarea.free{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.bz{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.tw{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.mt th,table.mt td{border:1.5px solid var(--line);padding:6px 6px;text-align:center}
table.mt th{background:var(--surface-2);font-weight:700}
table.mt th small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
table.mt tr.cur td{background:var(--blue-soft)}
table.mt tr.done td{background:var(--ok-soft)}
table.mt tr.lock td{color:var(--ink-soft)}
table.mt td.v b{font-size:16px}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft);padding:0 6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.ctlrow{display:flex;flex-direction:column;gap:4px}
.ctlrow > span{font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px}
.seg.full{display:flex}
.seg.full button{flex:1}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.gopt span{font-size:15px}
</style>
<style>
.overlay{position:fixed;inset:0;background:rgba(2,12,69,.6);overflow:auto;padding:24px max(16px,env(safe-area-inset-left,0px));z-index:20}
.overlay .card{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

.view canvas{background:transparent}
#tCv{width:100%;display:block;border-radius:10px}
.opt:disabled{opacity:.6;cursor:not-allowed}
table.mt td input.num{width:4.2em}
table.mt tr{cursor:pointer}
.reset.t{border-color:#E8892B;color:#FFD9B0}
.abg-ov{position:fixed;inset:0;background:rgba(2,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:60}
.abg-box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abg-box h2{margin:0}
.abg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abg-in{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit}
.abg-copy{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.abg-fb{font-weight:700;min-height:1.4em}
.abg-fb.ok{color:var(--ok)} .abg-fb.bad{color:var(--bad)}
.savebtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;padding:6px 14px;font-size:14px}
.savebtn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,137,43,.7)}50%{box-shadow:0 0 0 8px rgba(232,137,43,0)}}
.dlg{position:fixed;inset:0;background:rgba(2,12,69,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:50;overflow-y:auto}
.dlgcard{max-width:640px;width:100%;margin-top:4vh}
.dlghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlghead h3{margin:0;font-family:var(--f-display);font-size:20px}
.xbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;font-size:20px;line-height:1;color:var(--ink)}
.stand{border-radius:12px;padding:10px 12px;background:var(--surface-2,var(--bg));font-size:15px}
.stand b{font-family:var(--f-display)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>Solar-Labor</b><span>Warum liefert das Balkonkraftwerk so wenig?</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="reset t" id="teachBtn" type="button">Klassenergebnis</button><button class="reset savebtn" id="saveOpen" type="button" aria-haspopup="dialog">Speichern</button>
    <button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>
<main>
  <section class="card plot" aria-label="Modell">
    <canvas id="cv" aria-label="Modell"></canvas>
    <div class="views" id="views">
      <div class="view"><canvas id="cvA"></canvas><small id="capA"></small></div>

  </section>
  <aside class="side">
    <section class="card" id="ctlCard"><p class="eyebrow">Steuerpult</p><div id="ctl" class="ctl"></div></section>

</main>
<div class="overlay" id="teach" hidden><section class="card"><div class="row" style="justify-content:space-between"><div><p class="eyebrow">Lehrkraft · Beamer</p><h2>Klassenergebnis: Welcher Faktor kostet Familie K. am meisten?</h2></div><button class="btn sec" type="button" id="tClose">Schließen</button></div>
<canvas id="tCv" aria-label="Rangliste der Faktoren"></canvas>

<div class="tgrid" id="tIn"></div>
<div class="row"><button class="btn tip" type="button" id="tModelBtn">Plan B: Beispielwerte aus dem Modell</button><button class="btn sec sm" type="button" id="tClear">Alle Werte löschen</button></div></section></div>
<div class="dlg" id="saveDlg" hidden role="dialog" aria-modal="true" aria-labelledby="saveTitle"><section class="card stack dlgcard" id="saveBody"></section></div>
<script>

/* ---------- Steuerpult ---------- */
function renderCtl(){var sc=STATIONS[st.station].scene,h='',pro=STATIONS[st.station].key==='s6';
  if(sc==='balcony'){h='<label class="chk"><input type="checkbox" id="tCause"'+(st.showCauses||st.station===4?' checked':'')+(st.station===4?' disabled':'')+'> Auffälligkeiten am Balkon markieren</label><p class="muted">Schaut euch das Bild genau an: Was könnte die Leistung verringern?</p>';}
  else{var p=st.grp?G().p:null,parts=[];
    function sl(k){if(k==='d')return slider('D','ABSTAND',st.set.d+' cm',15,60,1,st.set.d,'15 cm','60 cm','g');if(k==='a')return slider('W','EINFALLSWINKEL',st.set.a+'°',0,85,1,st.set.a,'0°','85°','g');
      if(k==='n')return slider('N','LAGEN PAPIER',String(st.set.n),0,4,1,st.set.n,'0','4','g');return '<div class="ctlrow"><span>ABGEDECKT</span>'+segHTML('sS',SHADE_SHORT.map(function(t,i){return [i,t];}),st.set.s)+'</div>';}
    if(pro)parts=['s','n','d','a'];else if(p)parts=[p];
    h=parts.map(sl).join('')+(parts.length?'':'<p class="muted">Wählt in Station 1 eure Gruppe.</p>')+
      '<hr class="sep"><label class="chk"><input type="checkbox" id="tModel"'+(st.model?' checked':'')+'> Plan B: im Modell messen (nur wenn die Lehrkraft es sagt)</label>';}
  $('ctl').innerHTML=h;
  if($('tCause'))$('tCause').addEventListener('change',function(){st.showCauses=this.checked;draw();});
  if($('tModel'))$('tModel').addEventListener('change',function(){st.model=this.checked;save();draw();});
  if($('DS'))bindSlider('D',function(){return st.set.d;},function(v){st.set.d=v;$('dispD').textContent=v+' cm';},1,15,60);
  if($('WS'))bindSlider('W',function(){return st.set.a;},function(v){st.set.a=v;$('dispW').textContent=v+'°';},1,0,85);
  if($('NS'))bindSlider('N',function(){return st.set.n;},function(v){st.set.n=v;$('dispN').textContent=String(v);},1,0,4);
  bindSeg('sS',function(v){st.set.s=+v;draw();});
}

/* ---------- Aufgaben ---------- */
var GUESS=[{k:'A',t:'der <b>Schatten</b> vom Nachbarbalkon'},{k:'B',t:'die dünne <b>Staubschicht</b>'},{k:'C',t:'der leichte <b>Dunst</b> (schwächeres Licht)'},{k:'D',t:'die <b>schräge</b> Ausrichtung (30°)'}];
function guessName(k){return {A:'A (Schatten)',B:'B (Staub)',C:'C (Dunst)',D:'D (schräg)'}[k]||'';}
function head(i,t){return '<div><p class="eyebrow'+(STATIONS[i].pro?' pro':'')+'">'+(STATIONS[i].pro?'Profi-Zusatz ★':'Station '+(i+1)+' · '+STATIONS[i].name)+(st.grp&&!STATIONS[i].pro&&i>0?' · Gruppe '+st.grp+': '+G().name:'')+'</p><h2>'+t+'</h2></div>';}

/* Station 1 */
function r1(){var s=st.s1,g=st.grp?G():null;
  var fall='<p>Familie K. hat ein <b>Balkonkraftwerk</b> gekauft. Es kann bis zu <b>800 W</b> liefern. Heute scheint mittags die Sonne, aber die App zeigt nur <b>180 W</b>.</p>';
  var guess='<div class="guess stack"><p class="eyebrow pro">Eure Vermutung</p><p>Welche Ursache kostet Familie K. am meisten Leistung?</p><div class="choice" id="gs">'+
    GUESS.map(function(o){return '<button type="button" class="opt gopt'+(st.guess===o.k?' sel':'')+'" data-k="'+o.k+'"><span class="L">'+o.k+'</span><span>'+o.t+'</span></button>';}).join('')+
    '</div><p class="muted">'+(st.guess?'Gespeichert: Vermutung '+st.guess+'. Am Ende der Stunde prüfen wir sie mit den Messwerten der ganzen Klasse.':'Hier gibt es noch kein richtig oder falsch.')+'</p></div>';
  var grp='<div class="q"><p><b>Eure Gruppe:</b> Welchen Faktor untersucht ihr?</p><div class="choice grid2" id="gg">'+GKEYS.map(function(k){var x=GROUPS[k];return '<button type="button" class="opt'+(st.grp===k?' sel':'')+'" data-k="'+k+'"'+(s.ok?' disabled':'')+'><b>'+k+' · '+x.name+'</b><br><span class="muted">'+x.lvl+'</span></button>';}).join('')+'</div>'+(s.ok?'<p class="muted">Die Gruppe ist festgelegt.</p>':'')+'</div>';
  var pred=g?'<div class="q"><p><b>Eure Vorhersage</b> für Familie K.: '+g.fam+'</p><p>Wie viel Prozent der Leistung bleiben bei <b>'+g.famLab+'</b> übrig?</p>'+
    '<div class="lift"><div class="disp"><small>VORHERSAGE</small><span id="dispPr">'+st.pred+' %</span></div><div class="keys"><button class="key" id="Prm" type="button" aria-label="weniger">◀</button><button class="key" id="Prp" type="button" aria-label="mehr">▶</button></div></div>'+
    '<input type="range" id="PrS" min="0" max="100" step="5" value="'+st.pred+'" aria-label="Vorhersage in Prozent"'+(s.ok?' disabled':'')+'><div class="scale"><span>0 % (nichts mehr)</span><span>100 % (keine Änderung)</span></div>'+
    (s.ok?'<p class="fb ok">Vorhersage gespeichert: '+st.pred+' %</p>':'<div class="row"><button class="btn pri" type="button" id="c1">Vorhersage speichern</button></div><p class="fb" id="fb1"></p>')+'</div>':'';
  $('task').innerHTML=head(0,'Warum liefert das Balkonkraftwerk so wenig?')+fall+guess+grp+pred+(st.done[0]?'<p class="win"><b>Startklar!</b> Jetzt plant ihr eure Messung.</p>':'')+'<div class="row">'+nextBtn(0)+'</div>';
  Array.prototype.forEach.call(document.querySelectorAll('#gs .opt'),function(b){b.addEventListener('click',function(){st.guess=b.dataset.k;save();r1();});});
  Array.prototype.forEach.call(document.querySelectorAll('#gg .opt'),function(b){b.addEventListener('click',function(){if(s.ok)return;st.grp=b.dataset.k;st.s3.rows=[];st.s2.stepsOk=false;save();r1();});});
  if($('PrS')&&!s.ok){var u=function(v){st.pred=Math.max(0,Math.min(100,v));$('PrS').value=st.pred;$('dispPr').textContent=st.pred+' %';save();};
    $('PrS').addEventListener('input',function(){u(+this.value);});$('Prm').addEventListener('click',function(){u(st.pred-5);});$('Prp').addEventListener('click',function(){u(st.pred+5);});}
  if($('c1'))$('c1').addEventListener('click',function(){var fb=$('fb1');if(!st.guess){fb.className='fb bad';fb.textContent='Wählt oben zuerst eure Vermutung A, B, C oder D.';return;}s.ok=true;finish(0);save();r1();});
  bindNext();
}

/* Station 2: Planen */
var QMEAS={q:'Was müsst ihr messen, um die Leistung zu bestimmen?',o:['Spannung U <b>und</b> Stromstärke I','nur die Spannung U','nur die Stromstärke I'],a:0,ok:'Genau! Für die Leistung braucht ihr beide Größen.',bad:['','Die Spannung allein reicht nicht: Bei schwachem Licht ändert sie sich kaum, die Stromstärke aber stark.','Mit der Stromstärke allein könnt ihr die Leistung nicht berechnen. Was fehlt?']};
var QPF={q:'Mit welcher Formel berechnet ihr die elektrische Leistung?',o:['P = U · I','P = U + I','P = U : I'],a:0,ok:'Richtig! Leistung = Spannung mal Stromstärke. Mit I in mA kommt P in mW heraus.',bad:['','Schaut in euer Heft (Stunde 2): Die Größen werden nicht addiert.','Schaut in euer Heft (Stunde 2): Die Größen werden nicht geteilt.']};
var KONST=[{id:'d',t:'Abstand Lampe – Modul'},{id:'a',t:'Winkel des Moduls'},{id:'s',t:'Abdeckung durch Pappe'},{id:'n',t:'Lagen Transparentpapier'},{id:'L',t:'dieselbe Lampe'},{id:'R',t:'derselbe Lastwiderstand'},{id:'I',t:'die Stromstärke I'}];
function konstAns(id){if(id==='I')return false;return id!==G().p;}
function r2(){var s=st.s2,g=G();
  var meas=mcHTML('meas',QMEAS.q,QMEAS.o,s.meas,QMEAS.a);
  var pf=s.measOk?mcHTML('pf',QPF.q,QPF.o,s.pform,QPF.a):'';
  var kon=s.pformOk?'<div class="q"><p><b>Fairer Versuch:</b> Ihr verändert nur <b>'+(g.p==='s'?'die Abdeckung':g.p==='n'?'die Lagen Papier':g.p==='d'?'den Abstand':'den Winkel')+'</b>. Was müsst ihr dabei <b>gleich lassen</b>? Kreuzt alles Passende an.</p>'+
    KONST.map(function(k){return '<label class="chk"><input type="checkbox" data-k="'+k.id+'"'+(s.konst[k.id]?' checked':'')+(s.konstOk?' disabled':'')+'> '+k.t+'</label>';}).join('')+
    (s.konstOk?'':'<div class="row"><button class="btn pri" type="button" id="c2k">Prüfen</button></div>')+'<p class="fb" id="fb2k"></p></div>':'';
  var steps='';
  if(s.konstOk){if(g.fix){steps='<div class="q"><p><b>Eure Messreihe</b> ist vorgegeben:</p><ol style="margin:0;padding-left:1.2em">'+g.fix.map(function(v,i){return '<li>'+rowLabel(v,i)+'</li>';}).join('')+'</ol><p class="muted">'+g.task+'</p></div>';if(!s.stepsOk){s.stepsOk=true;save();}}
    else{steps='<div class="q"><p><b>Plant eure Messreihe selbst.</b> Die Referenz ist 0°. Wählt 4 bis 5 weitere Winkel zwischen 5° und 85°, aufsteigend. <b>30°</b> muss dabei sein, denn so schräg steht das Modul von Familie K.</p><div class="row">'+
      s.steps.map(function(v,i){return '<input class="num" data-st="'+i+'" inputmode="decimal" value="'+esc(v)+'" aria-label="Winkel '+(i+1)+'"'+(s.stepsOk?' disabled':'')+'><span>°</span>';}).join('')+'</div>'+
      (s.stepsOk?'':'<div class="row"><button class="btn pri" type="button" id="c2s">Plan prüfen</button><button class="btn tip" type="button" id="t2s">Tipp anzeigen</button></div>')+'<p class="fb" id="fb2s"></p><p class="hint" id="h2s" hidden><b>Tipp:</b> Gleichmäßige Schritte machen den Graphen gut lesbar, zum Beispiel 15°, 30°, 45°, 60°, 75°.</p><p class="muted">'+g.task+'</p></div>';}}
  if(s.stepsOk&&s.konstOk&&s.pformOk)finish(1);
  $('task').innerHTML=head(1,'Wie messen wir fair?')+'<p>'+g.task+'</p>'+meas+pf+kon+steps+(st.done[1]?'<p class="win"><b>Plan steht!</b> Baut jetzt auf und messt.</p>':'')+'<div class="row">'+nextBtn(1)+'</div>';
  mcBind('meas',QMEAS,s,'meas','s2meas',r2);if(s.measOk)mcBind('pf',QPF,s,'pform','s2pf',r2);
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'),function(c){if(c.type==='checkbox')c.addEventListener('change',function(){s.konst[c.dataset.k]=c.checked;save();});});
  if($('c2k'))$('c2k').addEventListener('click',function(){var wrong=KONST.filter(function(k){return !!s.konst[k.id]!==konstAns(k.id);}),fb=$('fb2k');tryInc('s2konst',!wrong.length,wrong.map(function(k){return k.id;}).join(','));
    if(!wrong.length){s.konstOk=true;save();r2();return;}var w0=wrong[0];fb.className='fb bad';
    fb.textContent=w0.id==='I'?'Die Stromstärke messt ihr. Sie darf sich ändern, sie ist euer Ergebnis.':w0.id===g.p?'„'+w0.t+'“ ist genau das, was ihr verändert.':'Noch nicht vollständig: Alles, was ihr nicht untersucht, muss gleich bleiben.';
    showHelp(fb,'s2konst',function(){KONST.forEach(function(k){s.konst[k.id]=konstAns(k.id);});s.konstOk=true;save();r2();});});
  if(s.konstOk&&!s.konst._shown){helpMsg('fb2k','Richtig! Nur eine Größe verändern, alles andere gleich lassen. So wird der Versuch fair.');}
  Array.prototype.forEach.call(document.querySelectorAll('[data-st]'),function(inp){inp.addEventListener('input',function(){s.steps[+inp.dataset.st]=inp.value;save();});});
  if($('t2s'))$('t2s').addEventListener('click',function(){$('h2s').hidden=false;});
  if($('c2s'))$('c2s').addEventListener('click',function(){var v=s.steps.map(num).filter(function(x){return !isNaN(x);}),fb=$('fb2s'),err='';
    if(v.length<4)err='Tragt mindestens 4 Winkel ein.';else if(v.some(function(x){return x<5||x>85;}))err='Alle Winkel müssen zwischen 5° und 85° liegen.';
    else if(v.some(function(x,i){return i>0&&x<=v[i-1];}))err='Ordnet die Winkel aufsteigend und ohne Doppelte.';else if(v.indexOf(30)<0)err='30° fehlt noch. So schräg steht das Modul von Familie K.';
    tryInc('s2steps',!err,v.join('/'));if(err){fb.className='fb bad';fb.textContent=err;showHelp(fb,'s2steps',function(){s.steps=['15','30','45','60','75'];s.stepsOk=true;save();r2();});return;}
    s.steps=v.map(String);while(s.steps.length<5)s.steps.push('');s.stepsOk=true;st.s3.rows=[];save();r2();});
  bindNext();
}

/* Station 3: Messen */
function r3(){var s=st.s3,g=G(),vals=rowVals();ensureRows();
  var rows=vals.map(function(v,i){var r=s.rows[i],p=rowP(i),q=pct(i),ref=i===0;
    var pc=ref?(s.refOk?'<b>'+fmt(p,0)+'</b>':'<input class="num" id="refP" inputmode="decimal" value="'+esc(s.refP)+'" aria-label="Leistung der Referenz in mW">'):(isNaN(p)?'–':fmt(p,0));
    var qc=ref?'100 %':(isNaN(q)||!s.refOk?'–':'<b>'+fmt(q,0)+' %</b>');
    return '<tr class="'+(i===st.row?'cur':'')+'" data-row="'+i+'"><td style="text-align:left">'+rowLabel(v,i)+'</td><td><input class="num" data-u="'+i+'" inputmode="decimal" value="'+esc(r.U)+'" aria-label="Spannung"></td><td><input class="num" data-ii="'+i+'" inputmode="decimal" value="'+esc(r.I)+'" aria-label="Stromstärke"></td><td class="v">'+pc+'</td><td class="v">'+qc+'</td></tr>';}).join('');
  var warn=vals.map(function(v,i){var q=pct(i);return i>0&&s.refOk&&q>105?'Zeile '+(i+1)+': mehr als die Referenz? Prüft, ob ihr aus Versehen noch etwas anderes verändert habt (Lampe, Abstand, Raumlicht).':'';}).filter(Boolean);
  $('task').innerHTML=head(2,'Referenz und Messreihe')+
    '<p><b>1.</b> Messt zuerst die <b>Referenz</b> unter besten Bedingungen: senkrecht zur Lampe, 20 cm Abstand, nichts abgedeckt. <b>2.</b> Berechnet P für die Referenz selbst. <b>3.</b> Messt dann Zeile für Zeile. Die App rechnet ab Zeile 2 für euch.</p>'+
    '<p class="muted">Tippt eine Zeile an, dann zeigt das Modell links die passende Einstellung.</p>'+
    '<div class="tw"><table class="mt"><thead><tr><th>'+g.head+'</th><th>U<small>in V</small></th><th>I<small>in mA</small></th><th>P = U · I<small>in mW</small></th><th>Anteil<small>an P<sub>Ref</sub></small></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (s.refOk?'':'<div class="row"><button class="btn pri" type="button" id="c3r">Referenz-Leistung prüfen</button></div>')+'<p class="fb" id="fb3r"></p>'+
    warn.map(function(t){return '<p class="note">'+t+'</p>';}).join('')+
    (s.ok?'':'<div class="row"><button class="btn pri" type="button" id="c3">Messung abschließen</button></div>')+'<p class="fb" id="fb3"></p>'+
    '<p class="hint"><b>Messtipps:</b> Lampe nur zum Messen einschalten und nicht anfassen, sie wird heiß. Immer mit angeschlossener Last messen. Kurz warten, bis der Wert ruhig ist.</p>'+
    (st.done[2]?'<p class="win"><b>Gemessen!</b> Jetzt wertet ihr aus.</p>':'')+'<div class="row">'+nextBtn(2)+'</div>';
  function upd(){save();var tb=document.querySelectorAll('[data-row]');vals.forEach(function(v,i){var tr=tb[i],p=rowP(i),q=pct(i);if(i>0){tr.children[3].innerHTML=isNaN(p)?'–':fmt(p,0);tr.children[4].innerHTML=isNaN(q)||!s.refOk?'–':'<b>'+fmt(q,0)+' %</b>';}else if(s.refOk){tr.children[3].innerHTML='<b>'+fmt(p,0)+'</b>';}});drawGraph();}
  Array.prototype.forEach.call(document.querySelectorAll('[data-u],[data-ii]'),function(inp){inp.addEventListener('input',function(){var i=+(inp.dataset.u||inp.dataset.ii);if(inp.dataset.u!=null)s.rows[i].U=inp.value;else s.rows[i].I=inp.value;if(i===0&&s.refOk){s.refOk=false;save();r3();return;}upd();});
    inp.addEventListener('focus',function(){var i=+(inp.dataset.u||inp.dataset.ii);if(st.row!==i){applyRow(i);Array.prototype.forEach.call(document.querySelectorAll('[data-row]'),function(tr,j){tr.className=j===i?'cur':'';});renderCtl();draw();}});});
  Array.prototype.forEach.call(document.querySelectorAll('[data-row]'),function(tr){tr.addEventListener('click',function(){var i=+tr.dataset.row;if(st.row===i)return;applyRow(i);Array.prototype.forEach.call(document.querySelectorAll('[data-row]'),function(t,j){t.className=j===i?'cur':'';});renderCtl();draw();});});
  if($('refP'))$('refP').addEventListener('input',function(){s.refP=this.value;save();});
  if($('c3r'))$('c3r').addEventListener('click',function(){var fb=$('fb3r'),U=num(s.rows[0].U),I=num(s.rows[0].I),P=num(s.refP);
    if(isNaN(U)||isNaN(I)){fb.className='fb bad';fb.textContent='Tragt zuerst U und I der Referenz ein.';return;}
    if(U<=0||U>15||I<=0||I>3000){fb.className='fb bad';fb.textContent='Prüft die Messwerte: Ist U in V und I in mA eingetragen?';return;}
    var ok=!isNaN(P)&&Math.abs(P-U*I)<=Math.max(1,0.03*U*I);tryInc('s3ref',ok,s.refP);
    if(ok){s.refOk=true;save();r3();helpMsg('fb3r','Richtig gerechnet! P_Ref = '+fmt(U*I,0)+' mW. Das sind ab jetzt 100 %.');return;}
    fb.className='fb bad';fb.textContent=(!isNaN(P)&&Math.abs(P-U*I/1000)<0.03*U*I/1000+0.001)?'Fast! Ihr habt in W gerechnet. Gebt P in mW an (I steht in mA).':'Noch nicht. Rechnet P = U · I = '+fmt(U,2)+' V · '+fmt(I,0)+' mA.';
    showHelp(fb,'s3ref',function(){s.refP=fmt(U*I,0);s.refOk=true;save();r3();});});
  if($('c3'))$('c3').addEventListener('click',function(){var fb=$('fb3');if(!s.refOk){fb.className='fb bad';fb.textContent='Prüft zuerst die Referenz-Leistung.';return;}
    var miss=vals.filter(function(v,i){return isNaN(rowP(i));}).length;if(miss){fb.className='fb bad';fb.textContent='Es fehlen noch Messwerte in '+miss+(miss>1?' Zeilen.':' Zeile.');return;}
    s.ok=true;finish(2);save();r3();});
  bindNext();
}

/* Station 4: Auswerten */
var MC4={
  A:{q:'Eine ganze Zelle ist nur ¼ der Fläche. Trotzdem bricht die Leistung fast ganz ein. Warum?',o:['Die Zellen sind in Reihe geschaltet. Durch alle Zellen fließt derselbe Strom, die abgedeckte Zelle bremst ihn für alle.','Die abgedeckte Zelle wird heiß und schaltet das Modul ab.','Das Messgerät misst im Schatten falsch.'],a:0,ok:'Genau! Wie bei einer Kette: Die schwächste Zelle bestimmt den Strom. Der Streifen nimmt jeder Zelle nur ein wenig Licht, deshalb sinkt die Leistung dort viel weniger.',bad:['','Das Modul schaltet nicht ab. Schaut auf die Schaltung: Wie sind die Zellen verbunden?','Das Messgerät misst richtig. Vergleicht „1 Zelle“ und „Streifen“: gleiche Fläche, ganz andere Leistung.']},
  B:{q:'Was passiert mit jeder weiteren Lage Papier?',o:['Jede Lage lässt nur einen Teil des Lichts durch. Die Leistung sinkt jedes Mal um ungefähr denselben Anteil.','Ab der zweiten Lage ändert sich nichts mehr.','Jede Lage zieht genau gleich viele Milliwatt ab.'],a:0,ok:'Richtig! Darum lohnt sich schon das Putzen einer dünnen Staubschicht.',bad:['','Schaut auf euren Graphen: Sinkt die Leistung nach der zweiten Lage weiter?','Vergleicht die Abnahme von 0 auf 1 Lage mit der von 3 auf 4 Lagen. Ist sie gleich groß?']},
  C:{q:'Der Abstand verdoppelt sich von 20 cm auf 40 cm. Die Leistung …',o:['sinkt auf deutlich weniger als die Hälfte.','sinkt genau auf die Hälfte.','bleibt fast gleich.'],a:0,ok:'Genau! Das Licht verteilt sich auf eine viel größere Fläche. Auf das Modul trifft deutlich weniger Licht.',bad:['','Schaut in eure Tabelle: Wie viel Prozent sind bei 40 cm übrig?','Schaut in eure Tabelle: Wie viel Prozent sind bei 40 cm übrig?']},
  D:{q:'Wie hängt die Leistung vom Einfallswinkel ab?',o:['Bei kleinen Winkeln sinkt sie kaum, ab etwa 45° sinkt sie stark.','Sie sinkt mit jedem Grad gleich stark.','Sie ändert sich kaum.'],a:0,ok:'Richtig! Bei schrägem Licht trifft weniger Licht auf dieselbe Fläche, und ein Teil wird zurückgeworfen.',bad:['','Vergleicht den Verlust zwischen 0° und 15° mit dem zwischen 60° und 75°.','Schaut auf den größten Winkel in eurem Graphen.']}
};
var SATZ={A:'Je mehr Fläche einer einzelnen Zelle abgedeckt ist, desto …',B:'Je mehr Lagen auf dem Modul liegen, desto …',C:'Je größer der Abstand zur Lampe ist, desto …',D:'Je größer der Einfallswinkel ist, desto …'};
function cmpAns(){var f=famPct(),d=st.pred-f;return Math.abs(d)<=10?2:(d>0?0:1);}
function r4(){var s=st.s4,g=G(),f=famPct();
  var cmpQ={q:'Bei <b>'+g.famLab+'</b> habt ihr <b>'+(isNaN(f)?'–':fmt(f,0)+' %')+'</b> gemessen. Eure Vorhersage war <b>'+st.pred+' %</b>. Eure Vorhersage war also …',o:['zu hoch: Es bleibt weniger Leistung übrig als gedacht.','zu niedrig: Es bleibt mehr Leistung übrig als gedacht.','ungefähr richtig (höchstens 10 Prozentpunkte daneben).'],a:cmpAns(),ok:'Stimmt! Genau dafür messen Physiker: um Vermutungen zu prüfen.',bad:'Vergleicht die beiden Zahlen noch einmal.'};
  var cmp=mcHTML('cmp',cmpQ.q,cmpQ.o,s.cmp,cmpQ.a);
  var mc=s.cmpOk?mcHTML('mc4',MC4[st.grp].q,MC4[st.grp].o,s.mc,MC4[st.grp].a):'';
  var sent=s.mcOk?'<div class="q"><p><b>Euer Ergebnissatz:</b> Schreibt zwei Sätze mit euren Messwerten.</p><p class="muted">Satzbausteine: „'+SATZ[st.grp]+'“ · „Bei … sank die Leistung auf … % der Referenzleistung.“</p>'+
    '<textarea class="free" id="sent" rows="3" placeholder="'+esc(SATZ[st.grp])+'">'+esc(s.sent)+'</textarea>'+(s.ok?'':'<div class="row"><button class="btn sec sm" type="button" id="ins">Satzanfang einfügen</button><button class="btn pri" type="button" id="c4">Fertig</button></div>')+'<p class="fb" id="fb4"></p></div>':'';
  var report=s.ok?'<div class="merk"><h3>Für das Klassenergebnis</h3><p>Meldet der Lehrkraft: <span class="k">Gruppe '+st.grp+' · '+g.name+' · bei '+g.famLab+': '+(isNaN(f)?'–':fmt(f,0)+' %')+'</span></p></div>':'';
  $('task').innerHTML=head(3,'Was zeigen eure Messwerte?')+'<p>Schaut auf euren Graphen rechts unten im Modell-Bereich.</p>'+cmp+mc+sent+report+(st.done[3]?'<p class="win"><b>Ausgewertet!</b> Gleich vergleicht die ganze Klasse.</p>':'')+'<div class="row">'+nextBtn(3)+'</div>';
  mcBind('cmp',cmpQ,s,'cmp','s4cmp',r4);if(s.cmpOk)mcBind('mc4',MC4[st.grp],s,'mc','s4mc',r4);
  if($('sent')){$('sent').addEventListener('input',function(){s.sent=this.value;save();});
    if($('ins'))$('ins').addEventListener('click',function(){var t=$('sent');t.value=SATZ[st.grp].replace(' …','')+' '+(t.value||'');s.sent=t.value;save();t.focus();});
    if($('c4'))$('c4').addEventListener('click',function(){var fb=$('fb4');if(s.sent.trim().length<40){fb.className='fb bad';fb.textContent='Schreibt zwei ganze Sätze und nennt einen Messwert in %.';return;}if(!/\d/.test(s.sent)){fb.className='fb bad';fb.textContent='Nennt mindestens einen Messwert (eine Zahl in %).';return;}s.ok=true;finish(3);save();r4();});}
  bindNext();
}

/* Station 5: Familie K. */
var Q5={q:'Was sollte Familie K. <b>zuerst</b> ändern?',o:['Das Modul so versetzen, dass kein Schatten mehr darauf fällt.','Das Modul putzen.','Auf einen Tag ohne Dunst warten.','Das Modul genauer zur Sonne ausrichten.'],a:0,
  ok:'Genau! Der Schatten auf einer ganzen Zelle kostet am meisten Leistung, weil die Zellen in Reihe geschaltet sind. Den Dunst kann Familie K. gar nicht ändern.',bad:['','Putzen hilft, aber vergleicht im Klassenergebnis: Welcher Faktor lässt am wenigsten Leistung übrig?','Den Dunst kann Familie K. nicht ändern. Was kann sie selbst tun?','Ausrichten hilft ein wenig. Bei 30° bleibt aber noch viel Leistung übrig. Was kostet mehr?']};
function r5(){var s=st.s5;
  var q=mcHTML('q5',Q5.q,Q5.o,s.first,Q5.a);
  var why=s.firstOk?'<div class="q"><p><b>Begründet eure Empfehlung</b> mit Messwerten aus eurer Gruppe oder aus dem Klassenergebnis.</p><textarea class="free" id="why5" rows="3" placeholder="Familie K. sollte zuerst …, weil …">'+esc(s.why)+'</textarea>'+(s.ok?'':'<div class="row"><button class="btn pri" type="button" id="c5">Fertig</button></div>')+'<p class="fb" id="fb5"></p></div>':'';
  var refl=s.ok?'<div class="merk"><h3>Eure Vermutung vom Anfang</h3><p>Ihr habt vermutet: <span class="k">'+(st.guess?guessName(st.guess):'keine')+'</span>. '+(st.guess==='A'?'Das passt zum Klassenergebnis!':'Das Klassenergebnis zeigt: Der Schatten kostet am meisten.')+'</p></div>':'';
  $('task').innerHTML=head(4,'Diagnose für Familie K.')+'<p>Die Markierungen links zeigen die vier Ursachen. Nutzt das Klassenergebnis am Beamer.</p>'+q+why+refl+(s.ok?saveCTA(true):'')+(st.done[4]?'<p class="win"><b>Fall gelöst!</b> Schnell fertig? Probiert den Profi-Zusatz.</p>':'')+'<div class="row">'+nextBtn(4)+'</div>';
  mcBind('q5',Q5,s,'first','s5first',r5);
  if($('why5')){$('why5').addEventListener('input',function(){s.why=this.value;save();});if($('c5'))$('c5').addEventListener('click',function(){var fb=$('fb5');if(s.why.trim().length<30){fb.className='fb bad';fb.textContent='Schreibt einen ganzen Satz mit „weil“.';return;}s.ok=true;finish(4);save();r5();});}
  bindCTA();bindNext();
}

/* Profi-Zusatz */
var QBYP={q:'Echte Module haben <b>Bypass-Dioden</b>. Sie leiten den Strom an einer verschatteten Zellgruppe vorbei. Was bewirken sie?',o:['Bei Schatten auf einer Zelle fällt nur ein Teil der Leistung weg statt fast alles.','Das Modul liefert dann mehr als 100 %.','Das Modul liefert dann gar nichts mehr.'],a:0,ok:'Richtig! Die anderen Zellgruppen arbeiten weiter. Darum haben Balkonkraftwerke mehrere Bypass-Dioden.',bad:['','Mehr als die Referenz geht nicht, das Licht wird ja nicht mehr.','Das Gegenteil: Die Dioden retten einen Teil der Leistung.']};
var QMPP={q:'Euer Modul hängt an einem festen Widerstand. Ein echtes Balkonkraftwerk hat einen Wechselrichter, der immer die bestmögliche Leistung einstellt. Die Verluste bei Familie K. sind deshalb …',o:['etwas kleiner als bei euch. Die Reihenfolge der Faktoren bleibt aber gleich.','viel größer als bei euch.','genau gleich groß wie bei euch.'],a:0,ok:'Genau! Das ist eine Fehlerquelle beim Übertragen vom Modellversuch auf die Wirklichkeit.',bad:['','Der Wechselrichter holt das Beste heraus, die Verluste werden also nicht größer.','Der Wechselrichter stellt sich immer neu ein, euer Widerstand nicht. Dann kann es nicht genau gleich sein.']};
function r6(){var s=st.s6;
  var euro='<div class="q"><p><b>Was kostet der Schatten?</b> Ohne Verluste liefert das Balkonkraftwerk etwa <b>700 kWh</b> im Jahr. Mit dem Schatten sind es nur <b>55 %</b> davon. Eine kWh kostet <b>0,35 €</b>. Wie viel Geld verliert Familie K. pro Jahr?</p><div class="row"><input class="num'+(s.euroOk?' ok':'')+'" id="eu" inputmode="decimal" value="'+esc(s.euro)+'"'+(s.euroOk?' disabled':'')+'><span>€ pro Jahr</span>'+(s.euroOk?'':'<button class="btn pri" type="button" id="c6e">Prüfen</button>')+'</div><p class="fb" id="fb6e"></p></div>';
  var byp=mcHTML('byp',QBYP.q,QBYP.o,s.byp,QBYP.a),mpp=mcHTML('mpp',QMPP.q,QMPP.o,s.mpp,QMPP.a);
  $('task').innerHTML=head(5,'Für Profis')+'<p>Im Steuerpult könnt ihr jetzt alle vier Faktoren gleichzeitig einstellen. Probiert Kombinationen im Modell (Plan B einschalten).</p>'+euro+byp+mpp+(s.euroOk&&s.bypOk&&s.mppOk?saveCTA(true):'');
  if($('eu'))$('eu').addEventListener('input',function(){s.euro=this.value;save();});
  if($('c6e'))$('c6e').addEventListener('click',function(){var v=num(s.euro),fb=$('fb6e'),ok=Math.abs(v-110.25)<=2;tryInc('s6euro',ok,s.euro);
    if(ok){s.euroOk=true;save();r6();helpMsg('fb6e','Richtig! 45 % von 700 kWh = 315 kWh. 315 kWh · 0,35 € = 110,25 € pro Jahr.');return;}
    fb.className='fb bad';fb.textContent=Math.abs(v-134.75)<=2?'Das ist der Wert für die Energie, die noch ankommt. Gefragt ist der Verlust (45 %).':'Tipp: Verlust = 100 % − 55 % = 45 %. Rechnet erst die kWh, dann mal 0,35 €.';
    showHelp(fb,'s6euro',function(){s.euro='110,25';s.euroOk=true;save();r6();});});
  if(s.euroOk)helpMsg('fb6e','Richtig! 45 % von 700 kWh = 315 kWh. 315 kWh · 0,35 € = 110,25 € pro Jahr.');
  mcBind('byp',QBYP,s,'byp','s6byp',r6);mcBind('mpp',QMPP,s,'mpp','s6mpp',r6);bindCTA();
}

/* ---------- Lehrkraft: Klassenergebnis ---------- */
var TG=['A1','A2','B1','B2','C1','C2','D1','D2'];
function tLoad(){try{return JSON.parse(localStorage.getItem(TKEY)||'{}')||{};}catch(e){return {};}}
function tSave(o){try{localStorage.setItem(TKEY,JSON.stringify(o));}catch(e){}}
function openTeach(){var o=tLoad(),box=$('teach');box.hidden=false;
  $('tIn').innerHTML=TG.map(function(k){var g=GROUPS[k.charAt(0)];return '<label class="ctlrow"><span>GRUPPE '+k+' · '+g.name.toUpperCase()+' · '+g.famLab.toUpperCase()+'</span><span class="row"><input class="num" data-t="'+k+'" inputmode="decimal" value="'+esc(o[k]||'')+'"> %</span></label>';}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(i){i.addEventListener('input',function(){var x=tLoad();x[i.dataset.t]=i.value;tSave(x);drawTeach();});});
  drawTeach();}
function teachRows(){var o=tLoad();return GKEYS.map(function(k){var v=[o[k+'1'],o[k+'2']].map(num).filter(function(x){return !isNaN(x);});return {k:k,g:GROUPS[k],v:v.length?v.reduce(function(a,b){return a+b;},0)/v.length:NaN,n:v.length};});}
function drawTeach(){var c=$('tCv'),w=c.getBoundingClientRect().width||700,h=Math.round(Math.min(420,w*0.52)),dpr=window.devicePixelRatio||1;c.style.height=h+'px';c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
  var x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle=col('surface');x.fillRect(0,0,w,h);
  var rows=teachRows().filter(function(r){return !isNaN(r.v);}).sort(function(a,b){return a.v-b.v;}),F=ff();
  x.fillStyle=col('ink');x.font='600 18px '+F;x.textAlign='left';x.textBaseline='top';x.fillText('So viel Leistung bleibt in der Situation von Familie K. übrig',12,8);
  if(!rows.length){x.fillStyle=col('ink-soft');x.font='16px '+F;x.fillText('Tragt die Werte der Gruppen ein.',12,44);return;}
  var L=Math.min(260,w*0.34),R=w-70,top=48,bh=Math.min(56,(h-top-24)/4-12);
  rows.forEach(function(r,i){var y=top+i*(bh+14),bw=(R-L)*Math.min(100,r.v)/100;x.fillStyle=col('ink');x.font='bold 16px '+F;x.textAlign='right';x.textBaseline='middle';
    x.fillText((i+1)+'. '+r.g.rank,L-12,y+bh/2-9);x.font='14px '+F;x.fillStyle=col('ink-soft');x.fillText(r.g.famLab,L-12,y+bh/2+11);
    x.fillStyle=col('surface-2');x.fillRect(L,y,R-L,bh);x.fillStyle=r.g.col==='#1A1F36'?col('ink'):r.g.col;x.fillRect(L,y,Math.max(3,bw),bh);
    x.fillStyle=col('ink');x.textAlign='left';x.font='bold 18px '+F;x.fillText(fmt(r.v,0)+' %',L+bw+8,y+bh/2);});
  x.fillStyle=col('ink-soft');x.font='13px '+F;x.textAlign='left';x.textBaseline='bottom';x.fillText('Mittelwert der beiden Gruppen je Faktor · Platz 1 = größter Verlust',12,h-4);}
function bindTeach(){$('teachBtn').addEventListener('click',openTeach);$('tClose').addEventListener('click',function(){$('teach').hidden=true;});
  $('tModelBtn').addEventListener('click',function(){var o={};TG.forEach(function(k){var g=k.charAt(0);o[k]=fmt(modelPct(g,GROUPS[g].famV)+(k.charAt(1)==='2'?1.5:-1.5),0);});tSave(o);openTeach();});
  $('tClear').addEventListener('click',function(){var b=this;if(!b._armed){b._armed=true;b.textContent='Wirklich leeren?';setTimeout(function(){b._armed=false;b.textContent='Alle Werte löschen';},3000);return;}tSave({});openTeach();});
  window.addEventListener('resize',function(){if(!$('teach').hidden)drawTeach();});}

/* ---------- Ergebnisse als Text ---------- */
var TL=[['s2meas','Planen · Was messen?'],['s2pf','Planen · Formel'],['s2konst','Planen · Konstanten'],['s2steps','Planen · eigene Winkel (Gruppe D)'],['s3ref','Messen · P der Referenz berechnet'],['s4cmp','Auswerten · Vorhersage verglichen'],['s4mc','Auswerten · Deutung'],['s5first','Familie K. · Empfehlung'],['s6euro','Profi · Kosten'],['s6byp','Profi · Bypass-Dioden'],['s6mpp','Profi · Wechselrichter']];
function resText(){
  var r=st.res||{},d=new Date(),L=[],g=st.grp?G():null;
  L.push('SOLAR-LABOR · Warum liefert das Balkonkraftwerk so wenig?');
  L.push('Name: '+(r.name||'')+'    Klasse: '+(r.klasse||'')+'    Datum: '+d.toLocaleDateString('de-DE')+', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
  L.push('Gruppe: '+(g?st.grp+' · '+g.name+' ('+g.lvl+')':'keine gewählt'));
  L.push(standLine());
  L.push('Geschafft: '+STATIONS.map(function(x,i){return x.name+(st.done[i]?' ✓':' –');}).join(' | '));
  L.push('');
  L.push('MEINE VERMUTUNG: '+(st.guess?guessName(st.guess):'keine gewählt')+(st.guess==='A'?'  → passt':'  → laut Klassenergebnis meist A (Schatten)'));
  L.push('VORHERSAGE: bei '+(g?g.famLab:'–')+' bleiben '+st.pred+' %');
  L.push('');
  L.push('MESSREIHE'+(st.model?' (im Modell gemessen, Plan B)':''));
  if(g){rowVals().forEach(function(v,i){var row=st.s3.rows[i]||{},p=rowP(i),q=pct(i);L.push('  '+rowLabel(v,i)+': U = '+(row.U||'–')+' V, I = '+(row.I||'–')+' mA, P = '+(isNaN(p)?'–':fmt(p,0)+' mW')+', Anteil = '+(isNaN(q)?'–':fmt(q,0)+' %'));});
    L.push('  P der Referenz selbst berechnet: '+(st.s3.refP||'–')+' mW'+(st.s3.refOk?'  ✓':''));L.push('  Wert für Familie K. ('+g.famLab+'): '+(isNaN(famPct())?'–':fmt(famPct(),0)+' %'));}
  L.push('');
  L.push('AUSWERTUNG');
  L.push('  Ergebnissatz: '+((st.s4.sent||'').trim()||'(leer)'));
  if(st.grp)L.push('  '+strip(MC4[st.grp].q)+' → '+segAns(MC4[st.grp],st.s4.mc));
  L.push('');
  L.push('FAMILIE K.');
  L.push('  Empfehlung: '+segAns(Q5,st.s5.first));L.push('  Begründung: '+((st.s5.why||'').trim()||'(leer)'));
  L.push('');
  L.push('VERSUCHE (wie oft geprüft bzw. eine Antwort gewählt wurde, bis es richtig war)');
  var tt=triesLines(L,TL,'s6');
  L.push('');
  L.push('PROFI-ZUSATZ ★');
  L.push('  Kosten des Schattens: '+(st.s6.euro?st.s6.euro+' €'+(st.s6.euroOk?'  ✓':'  ✗'):'(nicht bearbeitet)'));
  L.push('  Bypass-Dioden: '+(st.s6.byp==null?'(nicht bearbeitet)':segAns(QBYP,st.s6.byp)));L.push('  Wechselrichter: '+(st.s6.mpp==null?'(nicht bearbeitet)':segAns(QMPP,st.s6.mpp)));
  var data={v:1,name:r.name||'',klasse:r.klasse||'',ts:Date.now(),grp:st.grp,model:st.model,done:st.done,guess:st.guess,pred:st.pred,rows:st.s3.rows,vals:st.grp?rowVals():[],refP:st.s3.refP,fam:isNaN(famPct())?null:Math.round(famPct()),sent:st.s4.sent||'',why:st.s5.why||'',tries:st.tries,help:tt.help,mins:tt.mins,resets:resets(),cur:st.station,saves:(st.saves||0)+1};
  var json=JSON.stringify(data);
  L.push('');L.push('Die beiden folgenden Zeilen sind für die Auswertung. Bitte nicht verändern.');
  L.push('#DATEN '+json);L.push('#PRUEF '+fnv('SL-v1|'+json));
  return L.join('\r\n');
}

/* ---------- Gesamt ---------- */
var lastSt=null;
function render(){if(st.station!==lastSt){if(STATIONS[st.station].scene==='setup'&&st.grp&&st.station!==5){ensureRows();applyRow(Math.min(st.row,rowVals().length-1));}if(st.station===5)st.set={d:20,a:0,n:0,s:0};lastSt=st.station;}
  renderRoute();renderCtl();[r1,r2,r3,r4,r5,r6][st.station]();resize();}
bindReset();initSave();bindTeach();
window.addEventListener('resize',resize);
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',draw);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
load();if(!st.t0){st.t0=Date.now();save();}if(!unlocked(st.station))st.station=0;if(st.station>0&&!st.grp)st.station=0;
render();remind();startDialog();
})();
