<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lern-Apps</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7486;
    --accent: #2f6fde;
    --accent-soft: #e6eefc;
    --border: #e1e5ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b2029;
      --text: #e8ebf2;
      --muted: #9aa3b5;
      --accent: #6c9cf0;
      --accent-soft: #23314b;
      --border: #2a303c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.45;
  }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 28px 0 10px;
  }
  .app {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
  }
  a.app:active { transform: scale(0.99); }
  .nr {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    display: grid; place-items: center;
  }
  .titel { font-weight: 600; }
  .info { color: var(--muted); font-size: 0.9rem; }
  .pfeil { margin-left: auto; color: var(--accent); font-size: 1.3rem; }
  .gesperrt { opacity: 0.5; }
  .zurueck {
    display: inline-block;
    margin: 0 0 4px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .hinweis {
    margin-top: 32px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--accent-soft);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<main>
  <h1 id="titel">Lern-Apps</h1>
  <p class="sub">Wähle dein Fach.</p>

  <div id="liste"></div>

  <div class="hinweis">
    <strong>Abgeben:</strong> Tippe in der App oben auf <strong>„Ergebnisse abgeben“</strong> und lade die Datei herunter.
    Lade sie dann in <strong>IServ → Aufgaben</strong> bei der Aufgabe mit dem Namen der App hoch.
  </div>
</main>

  const liste = document.getElementById("liste");
  const sub = document.querySelector(".sub");
  const titelEl = document.getElementById("titel");

  function istOffen(app) {
    return !!app.datei && app.frei !== false &&
      (!app.ab || new Date() >= new Date(app.ab + "T00:00:00"));
  }
  function themenVon(l) {
    const t = [];
    l.forEach(a => { if (a.thema && !t.includes(a.thema)) t.push(a.thema); });
    return t;
  }
  function kachel(nr, titel, info, href, offen) {
    const el = document.createElement(offen ? "a" : "div");
    el.className = "app" + (offen ? "" : " gesperrt");
    if (offen) el.href = href;
    el.innerHTML =
      '<div class="nr"></div>' +
      '<div><div class="titel"></div><div class="info"></div></div>' +
      (offen ? '<div class="pfeil">›</div>' : '');
    el.querySelector(".nr").textContent = nr;
    el.querySelector(".titel").textContent = titel;
    el.querySelector(".info").textContent = info;
    return el;
  }
  function ueberschrift(t) {
    const h = document.createElement("h2"); h.textContent = t; liste.appendChild(h);
  }
  function zurueckLink(text, href) {
    const a = document.createElement("a");
    a.href = href; a.className = "zurueck"; a.textContent = "‹ " + text;
    liste.appendChild(a);
  }
  function anzahl(n, eins, viele) { return n + " " + (n === 1 ? eins : viele); }
  function hashFuer(o) {
    return "#" + Object.keys(o).map(k => k + "=" + encodeURIComponent(o[k])).join("&");
  }
  function appKachel(fach, app, nr) {
    const offen = istOffen(app);
    return kachel(nr, app.titel, offen ? (app.info || "") : "folgt bald", fach.pfad + app.datei, offen);
  }
  function zusammenfassung(l) {
    const offen = l.filter(istOffen);
    const nt = themenVon(offen).length;
    const na = offen.filter(a => !a.thema).length;
    return [na ? anzahl(na, "App", "Apps") : "", nt ? anzahl(nt, "Thema", "Themen") : ""].filter(Boolean).join(" · ");
  }

  // Ebene 0: Fächer
  function zeigeFaecher() {
    liste.innerHTML = "";
    titelEl.textContent = "Lern-Apps";
    sub.textContent = "Wähle dein Fach.";
    ueberschrift("Fächer");
    FAECHER.forEach((fach, i) => {
      const offen = fach.apps.filter(istOffen).length;
      liste.appendChild(kachel(i + 1, fach.name, offen ? anzahl(offen, "App", "Apps") : "folgt bald",
        hashFuer({ f: fach.name }), offen > 0));
    });
  }

  // Ebene 1: Übersicht eines Fachs
  function zeigeUebersicht(fach) {
    liste.innerHTML = "";
    sub.textContent = "Wähle deinen Bereich.";
    zurueckLink("Fächer", "#");
    ueberschrift(fach.name);
    const ohneJg = fach.apps.filter(a => !a.jahrgang);
    let nr = 1;
    themenVon(ohneJg).forEach(thema => {
      const offen = ohneJg.filter(a => a.thema === thema && istOffen(a)).length;
      liste.appendChild(kachel(nr++, thema, offen ? anzahl(offen, "App", "Apps") : "folgt bald",
        hashFuer({ f: fach.name, t: thema }), offen > 0));
    });
    fach.jahrgaenge.forEach(jg => {
      const jgApps = fach.apps.filter(a => a.jahrgang === jg);
      const offen = jgApps.filter(istOffen).length;
      liste.appendChild(kachel(nr++, jg, offen ? zusammenfassung(jgApps) : "folgt bald",
        hashFuer({ f: fach.name, j: jg }), offen > 0));
    });
  }

  // Ebene 2: Themen eines Jahrgangs
  function zeigeJahrgang(fach, jg) {
    liste.innerHTML = "";
    sub.textContent = "Wähle dein Thema.";
    zurueckLink(fach.name, hashFuer({ f: fach.name }));
    ueberschrift(jg);
    const jgApps = fach.apps.filter(a => a.jahrgang === jg);
    let nr = 1;
    jgApps.filter(a => !a.thema).forEach(app => liste.appendChild(appKachel(fach, app, nr++)));
    themenVon(jgApps).forEach(thema => {
      const offen = jgApps.filter(a => a.thema === thema && istOffen(a)).length;
      liste.appendChild(kachel(nr++, thema, offen ? anzahl(offen, "App", "Apps") : "folgt bald",
        hashFuer({ f: fach.name, j: jg, t: thema }), offen > 0));
    });
  }

  // Ebene 3: Apps eines Themas
  function zeigeThema(fach, jg, thema) {
    liste.innerHTML = "";
    sub.textContent = "Wähle eine App.";
    if (jg) zurueckLink(jg, hashFuer({ f: fach.name, j: jg }));
    else zurueckLink(fach.name, hashFuer({ f: fach.name }));
    ueberschrift(thema);
    const themaApps = fach.apps.filter(a => (a.jahrgang || null) === (jg || null) && a.thema === thema);
    themaApps.filter(a => !a.ordner).forEach(app => liste.appendChild(appKachel(fach, app, app.nr)));
    let nr = themaApps.filter(a => !a.ordner).length + 1;
    [...new Set(themaApps.filter(a => a.ordner).map(a => a.ordner))].forEach(ordner => {
      const offen = themaApps.filter(a => a.ordner === ordner && istOffen(a)).length;
      const ziel = jg ? { f: fach.name, j: jg, t: thema, o: ordner } : { f: fach.name, t: thema, o: ordner };
      liste.appendChild(kachel(nr++, ordner, offen ? anzahl(offen, "App", "Apps") : "folgt bald",
        hashFuer(ziel), offen > 0));
    });
  }

  // Ebene 4: Apps in einem Ordner
  function zeigeOrdner(fach, jg, thema, ordner) {
    liste.innerHTML = "";
    sub.textContent = "Wähle eine App.";
    zurueckLink(thema, hashFuer(jg ? { f: fach.name, j: jg, t: thema } : { f: fach.name, t: thema }));
    ueberschrift(ordner);
    fach.apps.filter(a => (a.jahrgang || null) === (jg || null) && a.thema === thema && a.ordner === ordner)
      .forEach(app => liste.appendChild(appKachel(fach, app, app.nr)));
  }

  function anzeigen() {
    const p = {};
    location.hash.replace(/^#/, "").split("&").forEach(x => {
      const k = x.indexOf("=");
      if (k > 0) p[x.slice(0, k)] = decodeURIComponent(x.slice(k + 1));
    });
    // Alte Mathe-Links ohne Fach (#j=…) landen weiterhin in Mathematik
    let fach = FAECHER.find(f => f.name === p.f);
    if (!fach && (p.j || p.t)) fach = FAECHER[0];
    if (!fach) { zeigeFaecher(); window.scrollTo(0, 0); return; }
    titelEl.textContent = fach.name + "-Apps";
    const jg = fach.jahrgaenge.includes(p.j) ? p.j : null;
    const passt = a => (a.jahrgang || null) === jg && a.thema === p.t;
    if (p.t && p.o && fach.apps.some(a => passt(a) && a.ordner === p.o)) zeigeOrdner(fach, jg, p.t, p.o);
    else if (p.t && fach.apps.some(passt)) zeigeThema(fach, jg, p.t);
    else if (jg) zeigeJahrgang(fach, jg);
    else zeigeUebersicht(fach);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", anzeigen);
  anzeigen();
</script>
</body>
</html>
