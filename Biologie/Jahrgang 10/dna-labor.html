<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>DNA-Labor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout wie „Solar-Labor“: Kopfleiste mit Stationen-Weg · links Modell + zwei Ansichten · rechts Stationsaufgabe + Steuerpult. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}
main{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.plot{position:static}}
canvas{display:block;width:100%;border-radius:10px;touch-action:manipulation}
html,body,button,input,select,textarea,label,a,.opt,.key,.stop{touch-action:manipulation}
.views{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.view{display:flex;flex-direction:column;gap:4px;min-width:0}
.view canvas{aspect-ratio:1/1;max-width:100%}
.view small{font-size:13px;color:var(--ink-soft);text-align:center}
.view small b{color:var(--ink)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}
.ctl{display:flex;flex-direction:column;gap:8px}
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:6px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:28px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.disp.g{color:#9FD0FF}
.keys{display:flex;gap:8px;align-items:center}
.key{width:56px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
.key:disabled{opacity:.45;cursor:not-allowed}
.bkey{width:auto;min-width:72px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;gap:2px}
.bkey b{font-size:24px;font-family:var(--f-display)}
.bkey small{font-size:11px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.num{width:4.6em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:440px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{opacity:.7;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.seg.full{display:flex}
.seg.full button{flex:1}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.tipcard{border-left:4px solid var(--accent)}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.q{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.q p b{font-family:var(--f-display);font-weight:600}
.merk{border:2px solid var(--blue);border-radius:12px;padding:14px;background:var(--surface)}
.merk h3{color:var(--blue);margin-bottom:6px}
.merk .k{color:var(--blue);font-weight:700}
.tw{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.mt th,table.mt td{border:1.5px solid var(--line);padding:6px 6px;text-align:center}
table.mt th{background:var(--surface-2);font-weight:700}
table.mt th small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
table.mt td input.num{width:4.2em}
.ctlrow{display:flex;flex-direction:column;gap:4px}
.ctlrow > span{font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px}
.task-step{font-weight:700}
.abg-ov{position:fixed;inset:0;background:rgba(2,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:60}
.abg-box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abg-box h2{margin:0}
.abg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abg-in{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit}
.abg-copy{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.abg-fb{font-weight:700;min-height:1.4em}
.abg-fb.bad{color:var(--bad)}
.savebtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;padding:6px 14px;font-size:14px}
.savebtn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,137,43,.7)}50%{box-shadow:0 0 0 8px rgba(232,137,43,0)}}
.dlg{position:fixed;inset:0;background:rgba(2,12,69,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:50;overflow-y:auto}
.dlgcard{max-width:640px;width:100%;margin-top:4vh}
.dlghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlghead h3{margin:0;font-family:var(--f-display);font-size:20px}
.xbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;font-size:20px;line-height:1;color:var(--ink)}
.stand{border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:15px}
.stand b{font-family:var(--f-display)}
textarea.free{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.codebox{display:inline-flex;flex-direction:column;align-items:center;background:#111;color:#FFC94D;border-radius:12px;padding:6px 22px;margin-top:6px;font-family:ui-monospace,Menlo,monospace}.codebox small{font-size:11px;letter-spacing:2px;color:#9a9a9a}.codebox span{font-size:32px;letter-spacing:4px}
.codepad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:420px;margin:12px auto}.codepad button{min-height:52px;border:2px solid #CBD3E1;background:#F3F5FA;border-radius:12px;font-size:22px;font-weight:700;color:#0B1442}.codepad button:active{background:#E8892B}
.gate{border:3px solid #C8423D;background:#FDECEC;border-radius:16px;padding:18px;text-align:center;margin:12px 0;color:#14213d}.gate .gsig{font-size:54px;line-height:1}.gate h3{color:#B42318;margin:6px 0 8px;font-size:21px}.gate .gq{font-weight:700;font-size:17px}
.rfrow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}.rfrow p{margin:0 0 6px}.rfrow .fix{margin:6px 0 0;color:var(--ok)}
.abbox{border:2px dashed #1C66C0;background:#EEF4FC;color:#14213d;border-radius:12px;padding:10px 12px;margin:10px 0 2px}.abbox b{color:#1C66C0}.abbox p{margin:6px 0 0;font-size:16px;line-height:1.5}.abbox u{text-decoration:none;border-bottom:2px solid #E8892B;font-weight:600}
select{font:inherit!important;font-size:17px!important;font-weight:600;color:#1A1F36!important;-webkit-text-fill-color:#1A1F36;background:#fff!important;border:2px solid #1C66C0!important;border-radius:10px!important;padding:7px 34px 7px 12px!important;min-height:42px;line-height:1.3;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 stroke=%27%231C66C0%27 stroke-width=%272.2%27 fill=%27none%27/%3E%3C/svg%3E")!important;background-repeat:no-repeat!important;background-position:right 12px center!important;max-width:100%}
select option{font-size:17px;color:#1A1F36}
input.num:disabled{opacity:1!important;color:#1A1F36!important;-webkit-text-fill-color:#1A1F36;background:#E8F5E9!important;border-color:#2E7D32!important}
select:disabled{opacity:1!important;color:#1A1F36!important;-webkit-text-fill-color:#1A1F36;background-color:#E8F5E9!important;border-color:#2E7D32!important}
select.bad{border-color:#b42318!important;background-color:#fde3e3!important}
.lsatz{font-size:17px;line-height:2.1}
.deck{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.hint.tk{border:2px solid var(--pro);background:var(--pro-soft);border-style:solid}
.lsatz .ctlrow{margin-bottom:8px;line-height:1.4}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>DNA-Labor</b><span>Wie kann ein DNA-Test einen Täter überführen?</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="reset savebtn" id="saveOpen" type="button" aria-haspopup="dialog">Speichern</button>
    <button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>
<main>
  <section class="card plot" aria-label="Modell">
    <canvas id="cv" aria-label="Modell"></canvas>
    <div class="views">
      <div class="view"><canvas id="cvA"></canvas><small id="capA"></small></div>
      <div class="view"><canvas id="cvB"></canvas><small id="capB"></small></div>
    </div>
  </section>
  <aside class="side">
    <section class="card stack" id="task"></section>
    <section class="card" id="ctlCard"><p class="eyebrow">Steuerpult</p><div id="ctl" class="ctl"></div></section>
  </aside>
</main>
<div class="dlg" id="saveDlg" hidden role="dialog" aria-modal="true" aria-labelledby="saveTitle"><section class="card stack dlgcard" id="saveBody"></section></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var APP={mcLock:true,title:'DNA-Labor',file:'DNA-Labor',klasse:'10',lesson:'Wie kann ein DNA-Test einen Täter überführen?',welcome:'Willkommen im DNA-Labor!',intro:'In eure Schule wurde eingebrochen. Der Täter hat eine Blutspur hinterlassen. Heute findet ihr heraus, was die DNA ist, wie sie gebaut ist und warum ein DNA-Test den Täter überführen kann.'};
var KEY='dna-labor-v1',RKEY='dna-labor-resets';
var STATIONS=[
  {key:'s1',name:'Vorhersage',scene:'crime'},
  {key:'s2',name:'Erkunden',scene:'zoom'},
  {key:'s3',name:'Bauen',scene:'ladder'},
  {key:'s4',name:'Auswerten',scene:'chargaff'},
  {key:'s5',name:'Kopieren',scene:'repl'},
  {key:'s6',name:'Schlussfolgerung',scene:'crime'},
  {key:'s7',name:'Profi-Zusatz',pro:true,scene:'time'},
  {key:'s8',name:'Ergebnisse sichern',scene:'helix'}
];
function SI(k){for(var i=0;i<STATIONS.length;i++)if(STATIONS[i].key===k)return i;return -1;}
function SK(){return STATIONS[st.station]?STATIONS[st.station].key:'';}

/* ---------- DNA-Daten ---------- */
var PAIR={A:'T',T:'A',G:'C',C:'G'},BASES=['A','T','G','C'];
var BCOL={A:'#E5604D',T:'#5FAE3E',G:'#3F86D6',C:'#F2C23A'},BINK={A:'#FFFFFF',T:'#FFFFFF',G:'#FFFFFF',C:'#3A2A00'};
var BNAME={A:'Adenin',T:'Thymin',G:'Guanin',C:'Cytosin'};
function comp(s){return s.split('').map(function(b){return PAIR[b];}).join('');}
var TOP='TACGGATC',BOT=comp(TOP);            /* Abschnitt aus der Blutspur */
var RN=6,ROT=TOP.slice(0,RN),ROB=BOT.slice(0,RN); /* Teil für die Replikation */
var SUS=[{k:'B',n:'Herr B.',s:'TACGCATC'},{k:'M',n:'Frau M.',s:'TACGGATC'},{k:'K',n:'Herr K.',s:'TTCGGATG'}];
var CHD=[{n:'Mensch',v:{A:31,T:31,G:19,C:19},g:'A'},{n:'Schaf',v:{A:30,T:30,G:20,C:20},g:'T'},{n:'Alge',v:{A:20,T:20,G:30,C:30},g:'G'},{n:'Weizen',v:{A:27,T:27,G:23,C:23},g:'C'}];
var ZL=[{n:'weiße Blutzelle',w:'ca. 20 µm',x:'ca. 10.000-fach'},{n:'Zellkern',w:'ca. 8 µm',x:'ca. 25.000-fach'},{n:'Chromosom',w:'ca. 3 µm',x:'ca. 70.000-fach'},{n:'Chromatinfaden',w:'ca. 100 nm',x:'ca. 2 Millionen-fach'},{n:'DNA-Doppelhelix',w:'ca. 10 nm',x:'ca. 20 Millionen-fach'},{n:'Nukleotid',w:'ca. 1 nm',x:'ca. 200 Millionen-fach'}];

var st={station:0,done:[false,false,false,false,false,false,false,false],pv:{},zoom:0,mark:false,hi:false,
  s3:{b:['','','','','','','',''],sel:0,ok:false,view:0,bad:{}},
  s4:{t:{},ok:false,org:0,bad:{}},
  s5:{open:0,t:['','','','','',''],b:['','','','','',''],sel:{s:'t',i:0},ok:false,bad:{}},
  s7:{calc:'',calcOk:false},
  s8:{gate:false,code:'',no:false,rf:{},rfOk:false,badF:{},abOk:false},
  g:{},mc:{},res:{},tries:{},help:{},tips:{},errT:{},t0:null};

/* ---------- Speicher ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;
  Object.keys(x).forEach(function(k){if(x[k]==null)return;
    if(st[k]&&typeof st[k]==='object'&&!Array.isArray(st[k])&&typeof x[k]==='object'&&!Array.isArray(x[k]))st[k]=Object.assign(st[k],x[k]);else st[k]=x[k];});
  while(st.done.length<8)st.done.push(false);}catch(e){}}

/* ---------- gemeinsame Bausteine (wie Solar-Labor) ---------- */
function tryInc(k,ok,val){var t=st.tries[k]||(st.tries[k]={n:0,ok:false,first:null});if(t.ok)return;t.n++;if(t.first===null)t.first=!!ok;if(ok)t.ok=true;else if(val!=null&&val!==''){t.w=t.w||[];if(t.w.length<12)t.w.push(val);}save();}
function stuck(k){var t=st.tries[k];return !!(t&&!t.ok&&t.n>=3);}
function showHelp(fb,k,fn){if(!fb||!stuck(k))return;var id='hb_'+k;if(document.getElementById(id))return;var b=document.createElement('button');b.type='button';b.id=id;b.className='btn tip';b.style.marginTop='6px';b.textContent='Ich komme nicht weiter: Lösung zeigen';
  b.addEventListener('click',function(){st.help[k]=true;save();fn();});var wrap=document.createElement('div');wrap.className='row';wrap.appendChild(b);fb.insertAdjacentElement('afterend',wrap);}
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return ('0000000'+h.toString(16)).slice(-8);}
function rnd(k){return parseInt(fnv('r'+k).slice(0,6),16)/16777215;}
function resets(){try{return +(localStorage.getItem(RKEY)||0);}catch(e){return 0;}}
function fmt(v,d){var p=Math.pow(10,d||0);return String(Math.round(v*p)/p).replace('.',',');}
function num(s){if(s==null)return NaN;s=String(s).trim().replace(/\s/g,'').replace(/%$/,'').replace(',','.');if(s===''||!/^-?\d*\.?\d+$/.test(s))return NaN;return parseFloat(s);}
function col(n){return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();}
function ff(){return getComputedStyle(document.body).fontFamily;}
function font(px,b){return (b?'bold ':'')+px+'px '+ff();}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function strip(t){return String(t).replace(/<[^>]+>/g,'');}
function segHTML(id,opts,cur){return '<span class="seg full" id="'+id+'">'+opts.map(function(o){return '<button type="button" data-v="'+o[0]+'" class="'+(String(o[0])===String(cur)?'sel':'')+'">'+o[1]+'</button>';}).join('')+'</span>';}
function bindSeg(id,fn){var el=$(id);if(!el)return;Array.prototype.forEach.call(el.children,function(b){b.addEventListener('click',function(){Array.prototype.forEach.call(el.children,function(x){x.className=x===b?'sel':'';});fn(b.dataset.v);});});}
function slider(id,lab,disp,min,max,step,val,lo,hi){return '<div class="lift"><div class="disp g"><small>'+lab+'</small><span id="disp'+id+'">'+disp+'</span></div><div class="keys"><button class="key" id="'+id+'m" type="button" aria-label="weniger">◀</button><button class="key" id="'+id+'p" type="button" aria-label="mehr">▶</button></div></div>'+
  '<input type="range" id="'+id+'S" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" aria-label="'+lab+'"><div class="scale"><span>'+lo+'</span><span>'+hi+'</span></div>';}
function bindSlider(id,get,set,step,min,max){function u(v){v=Math.max(min,Math.min(max,v));set(v);$(id+'S').value=v;save();draw();}
  $(id+'S').addEventListener('input',function(){u(parseFloat(this.value));});$(id+'m').addEventListener('click',function(){u(get()-step);});$(id+'p').addEventListener('click',function(){u(get()+step);});}

/* Stationen-Weg */

function deckInner(key){var L=TIPS[key]||[],n=Math.min(L.length,(st.tipOpen||{})[key]||0);
  var h=L.slice(0,n).map(function(t,i){return '<p class="hint tk"><b>🃏 Tipp-Karte '+(i+1)+' von '+L.length+':</b> '+t+'</p>';}).join('');
  if(n<L.length)h+='<div class="row"><button type="button" class="btn tip" data-deck="'+key+'">🃏 '+(n?'Nächste Tipp-Karte ziehen ('+(n+1)+' von '+L.length+')':'Tipp-Karte ziehen')+'</button></div>';return h;}
function tipDeck(key){return TIPS[key]?'<div class="deck" id="dk_'+key+'">'+deckInner(key)+'</div>':'';}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-deck]');if(!b)return;var k=b.dataset.deck;st.tipOpen=st.tipOpen||{};st.tipOpen[k]=(st.tipOpen[k]||0)+1;save();var d=$('dk_'+k);if(d)d.innerHTML=deckInner(k);});
function setErr(key,L){st.errT=st.errT||{};st.errT[key]=L;st.tips=st.tips||{};st.tips[key]=(st.tips[key]||0)+L.length;save();var el=$('et_'+key);if(el)el.innerHTML=errCardsHTML(L);}
function clrErr(key){if(st.errT&&st.errT[key]){delete st.errT[key];save();}}
function needAll(fb,vals){if(vals.some(function(v){return v==null||v==='';})){fb.className='fb bad';fb.textContent='Füllt zuerst alle Lücken aus. Dann prüft die App.';return true;}return false;}
function stNo(i){var n=0;for(var k=0;k<=i;k++)if(!STATIONS[k].pro)n++;return n;}
function renderRoute(){var h='';STATIONS.forEach(function(s,i){var cls='stop'+(s.pro?' pro':'')+(i===st.station?' on':'')+(st.done[i]?' done':'');
    h+='<button type="button" class="'+cls+'" data-i="'+i+'"'+(unlocked(i)?'':' disabled')+'><span class="n">'+(st.done[i]?'✓':(s.pro?'★':stNo(i)))+'</span>'+s.name+'</button>';});
  $('route').innerHTML=h;Array.prototype.forEach.call($('route').querySelectorAll('.stop'),function(b){b.addEventListener('click',function(){go(+b.dataset.i);});});}
function go(i){if(!unlocked(i))return;st.station=i;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function finish(i){if(!st.done[i]){st.done[i]=true;save();renderRoute();}}
function nextBtn(i){if(!st.done[i]||i>=STATIONS.length-1)return '';var n=STATIONS[i+1];return '<button class="btn pri" type="button" id="nextSt">'+(n.pro?'Zu den Profi-Aufgaben ★':'Weiter zu Station '+stNo(i+1)+': '+n.name)+' →</button>';}
function bindNext(){var b=$('nextSt');if(b)b.addEventListener('click',function(){go(st.station+1);});}
function head(i,t){var S=STATIONS[i];return '<div><p class="eyebrow'+(S.pro?' pro':'')+'">'+(S.pro?'Profi-Zusatz ★':'Station '+stNo(i)+' · '+S.name)+'</p><h2>'+t+'</h2></div>';}

/* Multiple Choice mit „Antwort einloggen“ */
function mcHTML(id,q,opts,val,ans,grid){return '<div class="q"><p><b>'+q+'</b></p><div class="choice'+(grid?' grid2':'')+'" data-mc="'+id+'">'+opts.map(function(o,j){return '<button type="button" class="opt'+(val===j?(j===ans?' ok':' bad'):'')+'" data-j="'+j+'">'+o+'</button>';}).join('')+'</div><p class="fb" id="fb_'+id+'"></p></div>';}
function bindMC(id,ans,key,okMsg,badMsgs,onOk,store){var box=document.querySelector('[data-mc="'+id+'"]');if(!box)return;
  function evalJ(j){tryInc(key,j===ans,j);store(j);save();
    Array.prototype.forEach.call(box.children,function(x,i){x.className='opt'+(i===j?(j===ans?' ok':' bad'):'');});
    var fb=$('fb_'+id);if(j===ans){fb.className='fb ok';fb.textContent=okMsg;var lb=$('lock_'+id);if(lb)lb.parentNode.removeChild(lb);if(onOk)onOk();}else{fb.className='fb bad';fb.textContent=(typeof badMsgs==='string')?badMsgs:(badMsgs[j]||'Noch nicht. Schaut noch einmal ins Modell.');
      showHelp(fb,key,function(){store(ans);save();if(onOk)onOk();});}}
  var lock=APP.mcLock,done=!!box.querySelector('.opt.ok');
  if(lock&&!done){var sel=-1,wrap=document.createElement('div');wrap.className='row';wrap.id='lock_'+id;wrap.innerHTML='<button type="button" class="btn pri" disabled>Antwort einloggen</button>';
    box.parentNode.insertBefore(wrap,box.nextSibling);var lb=wrap.firstChild;
    Array.prototype.forEach.call(box.children,function(b){b.addEventListener('click',function(){sel=+b.dataset.j;Array.prototype.forEach.call(box.children,function(x,i){x.className='opt'+(i===sel?' sel':'');});lb.disabled=false;var fb=$('fb_'+id);if(fb){fb.className='fb';fb.textContent='';}});});
    lb.addEventListener('click',function(){if(sel>=0)evalJ(sel);});}
  else if(!lock)Array.prototype.forEach.call(box.children,function(b){b.addEventListener('click',function(){evalJ(+b.dataset.j);});});}
function showFb(id,ok,msg){var f=$('fb_'+id);if(f){f.className='fb '+(ok?'ok':'bad');f.textContent=msg;}}
function mcBind(id,Q,obj,field,key,rerender){bindMC(id,Q.a,key,Q.ok,Q.bad,function(){if(!obj[field+'Ok']){obj[field+'Ok']=true;save();rerender();showFb(id,true,Q.ok);}},function(j){obj[field]=j;});if(obj[field+'Ok'])showFb(id,true,Q.ok);}
function mcQ(id,Q){var h=mcHTML(id,Q.q,Q.o,st.mc[id],Q.a);return st.mc[id+'Ok']?h:h.replace(/<\/div>$/,tipDeck(id)+'</div>');}
function mcB(id,Q,key,rer){mcBind(id,Q,st.mc,id,key,rer);}
function mcTxt(id,Q){var v=st.mc[id];return v==null?'(nicht bearbeitet)':strip(Q.o[v])+(v===Q.a?'  ✓':'  ✗');}

/* Lückensätze mit Auswahl (gemeinsamer Baustein) */
function G0(id){st.g=st.g||{};return st.g[id]||(st.g[id]={v:{},bad:{},ok:false});}
function gapKeys(text){var a=[];text.replace(/\{(\w+)\}/g,function(m,k){a.push(k);return m;});return a;}
function gapSel(id,k,opts,dis){var g=G0(id),v=g.v[k];return '<select data-gp="'+id+'" data-gk="'+k+'" class="'+(g.bad[k]?'bad':'')+'"'+(dis?' disabled':'')+'><option value="">bitte wählen</option>'+opts.map(function(o){return '<option value="'+o[0]+'"'+(v===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>';}
function gapHTML(id,text,O,btn){var g=G0(id);var h='<div class="lsatz">'+text.replace(/\{(\w+)\}/g,function(m,k){return gapSel(id,k,O.opts[k],g.ok);})+'</div>';
  if(!g.ok)h+='<div class="row"><button class="btn pri" type="button" id="gb_'+id+'">'+(btn||'Einloggen und prüfen')+'</button></div><p class="fb" id="fbg_'+id+'"></p>'+tipHTML('g_'+id)+tipDeck('g_'+id);
  return h;}
function gapBind(id,text,O,onOk){var g=G0(id),ks=gapKeys(text);
  Array.prototype.forEach.call(document.querySelectorAll('[data-gp="'+id+'"]'),function(e){e.addEventListener('change',function(){g.v[e.dataset.gk]=e.value;g.bad[e.dataset.gk]=false;e.className='';save();});});
  var b=$('gb_'+id);if(!b)return;
  b.addEventListener('click',function(){var fb=$('fbg_'+id);if(needAll(fb,ks.map(function(k){return g.v[k];})))return;var bad={};
    ks.forEach(function(k){if(O.ans[k].indexOf(g.v[k])<0)bad[k]=true;});
    var ok=!Object.keys(bad).length;tryInc('g_'+id,ok,ks.map(function(k){return g.v[k];}).join('/'));
    if(ok){clrErr('g_'+id);g.bad={};g.ok=true;save();onOk();return;}
    setErr('g_'+id,ks.filter(function(k){return bad[k];}).map(function(k){return O.tips[k];}));g.bad=bad;save();
    ks.forEach(function(k){var e=document.querySelector('[data-gp="'+id+'"][data-gk="'+k+'"]');if(e)e.className=bad[k]?'bad':'';});
    var n=Object.keys(bad).length;fb.className='fb bad';fb.textContent=(n===1?'Eine Auswahl stimmt':n+' Auswahlen stimmen')+' noch nicht. Sie sind rot markiert. Die Tipp-Karten helfen.';
    showHelp(fb,'g_'+id,function(){ks.forEach(function(k){g.v[k]=O.ans[k][0];});g.bad={};g.ok=true;clrErr('g_'+id);save();onOk();});});}
function gapLabel(id,O,k){var v=G0(id).v[k],o=(O.opts[k]||[]).filter(function(x){return x[0]===v;})[0];return o?o[1]:'…';}
function gapText(id,text,O,u){return strip(text.replace(/\{(\w+)\}/g,function(m,k){var t=gapLabel(id,O,k);return u?'[[u]]'+t+'[[/u]]':t;})).replace(/\[\[u\]\]/g,'<u>').replace(/\[\[\/u\]\]/g,'</u>');}

  $('resCopy').addEventListener('click',function(){if(!need())return;var txt=resText(),t=$('resTxt');t.hidden=false;t.value=txt;$('resShow').textContent='Text ausblenden';

 function evalE(e){var t=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.');var toks=t.match(/\d+\.?\d*|\.\d+|[-+*/()]/g);if(!toks)return NaN;
